# 「돌려 보는 알고리즘」 채널 설정.
#
# 왜 이 형식인가: 앞선 두 시도가 같은 자리에서 막혔다. 슬라이드에 합성 음성을
# 얹으면 3초 안에 자동 생성물로 분류되고, 유튜브의 inauthentic content 정책이
# 거르는 것도 바로 그 "틀의 반복 재생산"이다.
#
# 여기서는 매 편 실제로 다른 계산이 돈다. 화면은 그 계산의 상태이고 소리는
# 그 계산에서 파생된다. 목소리가 없는 것이 흠이 아니라 이 장르의 기본값이다.
#
# 왜 롱폼인가: 숏폼 시청 시간은 파트너 프로그램의 3,000시간에 집계되지 않는다.
# 앞 채널이 61일 동안 숏츠로 13,848회를 모으고도 시청 시간 기여가 사실상
# 0이었다. 그리고 이 소재는 길이에 명분이 있다 — 버블 정렬이 384개를
# 정리하는 데 걸리는 시간이 곧 그 꼭지의 길이다. 늘린 것이 아니다.

channel:
  name: 돌려 보는 알고리즘
  handle: "@돌려보는알고리즘"

  # 나열형을 금지한다. 앞 채널의 "최신 기술 / AI / 인사이트 / 노하우"가
  # 정확히 그것이었고, 무엇을 보게 되는지 한 줄도 알려주지 못했다.
  description: |
    코드가 실제로 돌아가는 것을 봅니다.

    정렬 알고리즘 열두 종이 같은 숫자를 각자 정리하고, 미로 생성기가 길을
    파고, 경로 탐색이 출구를 찾습니다. 설명하는 목소리는 없습니다 —
    화면에서 일어나는 일이 곧 설명입니다.

    소리도 계산에서 나옵니다. 지금 만지고 있는 값이 크면 높은 음이 납니다.
    그래서 화면에서 눈을 떼도 어디까지 왔는지가 들립니다.

    배경음악도 음성 합성도 쓰지 않습니다. 화면과 소리 전부 그 자리에서
    계산해 만듭니다.

  keywords:
    - 알고리즘
    - 정렬 알고리즘
    - 알고리즘 시각화
    - 코딩테스트
    - 자료구조
    - 컴퓨터공학
    - 경로 탐색
    - 시뮬레이션
    - 프로그래밍
    - 개발자

# 주 1편으로 시작한다. 한 편 렌더에 CPU 로 10분 가까이 걸려서, 편수를 먼저
# 올리면 무료 실행 시간부터 확인해야 한다. 데이터를 보고 정한다.
schedule:
  per_week: 1
  days: [sat]
  hour_kst: 11    # 주말 오전, 틀어 놓는 시간대

# 앞으로 만들 것. **한 편도 같은 계산을 다시 돌리지 않는다** — 틀을 반복
# 재생산하지 않는다는 것이 이 채널이 서 있는 조건이라, 소재를 고를 때
# "화면에 나오는 것이 통째로 달라지는가"를 먼저 본다.
episodes:
  - {id: E01, title: "정렬 알고리즘 12종, 같은 데이터로", status: 제작됨}
  - {id: E02, title: "미로를 만드는 법 여섯 가지", note: "재귀 백트래킹·프림·크러스컬·이진 트리·이분법·와일슨"}
  - {id: E03, title: "같은 미로를 푸는 네 가지 방법", note: "BFS·DFS·다익스트라·A*, 방문한 칸을 색으로"}
  - {id: E04, title: "생명 게임 10만 세대", note: "글라이더 건이 실제로 도는 것"}
  - {id: E05, title: "무작위로 원주율 찍기 1억 번", note: "몬테카를로가 수렴하는 속도"}
  - {id: E06, title: "중력만으로 은하가 만들어진다", note: "N체 시뮬레이션, 바른스-헛"}
  - {id: E07, title: "노이즈 하나로 대륙 만들기", note: "펄린 노이즈에서 지형까지"}
  - {id: E08, title: "JPEG가 버리는 것", note: "DCT 계수를 하나씩 지워 가며"}
  - {id: E09, title: "유전 알고리즘이 걷기를 배운다", note: "4,000세대"}
  # E10 은 E01 의 엔진을 그대로 쓰되 입력을 바꾼다. 같은 화면이 아니라
  # **순위가 뒤집힌 화면**이 나오는 것이 요점이다 — 거의 정렬된 데이터에서는
  # 삽입 정렬과 팀소트가 퀵 정렬을 이긴다. 1편을 본 사람에게 주는 답이다.
  - {id: E10, title: "정렬 재대결 — 거의 정렬된 데이터", note: "1편과 순위가 뒤집힌다"}
