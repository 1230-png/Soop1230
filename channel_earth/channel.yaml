# 「지구의 오늘」 채널 설정.
#
# 소재: 공공 API 의 실시간 관측값. 지금은 USGS 지진 피드 하나이고,
# 뒤에 붙일 것은 아래 `sources` 에 적어 뒀다.
#
# 이 형식을 고른 이유는 **매 편 실제로 다른 데이터가 들어오기 때문**이다.
# 유튜브가 거르는 것은 "기계가 만들었다"가 아니라 "틀을 반복 재생산했다"인데,
# 지진은 날마다 위치도 깊이도 건수도 다르다. 지진이 조용한 날은 화면이 실제로
# 조용하고, 큰 것이 하나 온 날은 화면과 소리가 통째로 달라진다.

channel:
  name: 지구의 오늘
  handle: "@지구의오늘"

  description: |
    지구가 오늘 어떻게 움직였는지를 관측 자료 그대로 봅니다.

    하루 동안 전 세계에서 기록된 지진을 일어난 순서대로 지도에 찍습니다.
    점의 색은 진원 깊이, 크기는 규모이고, 소리의 높이와 크기도 그 둘에서
    나옵니다. 설명하는 목소리는 없습니다 — 자료가 그대로 화면이 됩니다.

    지도에서 미국 쪽 점이 유독 많은 것은 그곳에 지진이 많아서가 아니라
    관측망이 촘촘해 아주 작은 지진까지 잡히기 때문입니다. 관측 자료를 볼 때
    같이 봐야 하는 것이 그런 편향입니다.

    자료: USGS Earthquake Hazards Program
    지도: NASA Blue Marble

  keywords:
    - 지진
    - 실시간 지진
    - 데이터 시각화
    - 지구과학
    - USGS
    - 지진 정보
    - 공공데이터
    - 타임랩스

# 매일 숏폼 하나, 주 1회 롱폼 하나.
#
# **숏폼만으로는 수익화 요건에 닿지 못한다** — 숏폼 시청 시간은 파트너
# 프로그램의 3,000시간에 집계되지 않는다. 숏폼은 도달에, 롱폼은 시청 시간에
# 쓴다. 같은 코드가 두 벌을 뽑으므로 추가 비용이 거의 없다.
schedule:
  - kind: short
    every: daily
    hour_kst: 8          # 전날 UTC 하루치가 다 모인 뒤
    window: day
    size: 1080x1920
    lapse: 42
  - kind: long
    every: weekly
    day: sun
    hour_kst: 10
    window: week
    size: 1920x1080
    lapse: 300

# 붙일 순서. 하나씩 늘린다 — 한 번에 셋을 붙이면 어느 쪽이 깨졌는지
# 알 수 없고, API 마다 형식도 인증도 다르다.
sources:
  - id: usgs_quakes
    status: 구현됨
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/
    key: 필요 없음
    note: 1분마다 갱신. 기간별 요약 파일이 따로 있다
  - id: nasa_neo
    status: 계획
    url: https://api.nasa.gov/neo/rest/v1/feed
    key: NASA_API_KEY (무료 발급)
    note: 오늘 지구에 가까이 지나간 소행성. 거리를 달까지 거리로 환산해 보여 줄 것
  - id: noaa_space_weather
    status: 계획
    url: https://services.swpc.noaa.gov/json/
    key: 필요 없음
    note: 태양 플레어·지자기 폭풍. 오로라 예보와 묶으면 한 편이 된다
  - id: kma_public
    status: 검토
    url: 공공데이터포털 (기상청)
    key: 필요함
    note: 한국 기상 이변. 국내 시청자에게 가장 가까운 소재지만 인증이 붙는다
