# 「귀트는 일본어」롱폼 레시피.
#
# 왜 롱폼인가: 숏폼 시청 시간은 파트너 프로그램의 3,000시간에 집계되지 않는다.
# 숏폼을 아무리 올려도 그 숫자는 0에서 움직이지 않는다. 머니로직이 28일에
# 조회수 8,414회를 받고도 시청 시간이 14.8시간이었던 이유가 그것이다.
#
# 영상 길이는 phrase_count 가 정한다. target_minutes 는 이름표일 뿐이라
# build.py 가 완성된 영상과 대조해서 30% 넘게 어긋나면 **멈춘다**(영어판은
# 경고만 했다). 길이는 문장을 더 넣어서 버는 것이지 무음을 늘려서 버는 것이
# 아니다 — 죽은 시간으로 채운 영상은 지속률이 무너지고, 시청 시간이 오느냐
# 마느냐를 정하는 것이 지속률이다.

defaults:
  # ElevenLabs. 키는 ELEVENLABS_API_KEY 환경변수로만 들어온다.
  # 키가 없으면 멈춘다 — 다른 엔진으로 되돌아가지 않는다(lib/tts.py 참고).
  engine: elevenlabs
  # 일본어와 한국어를 같은 목소리가 읽는다. 나눌 일이 생기면 voice_ko 만
  # 다른 ID 로 바꾸면 되고 코드는 안 건드려도 된다.
  voice_ja: NxfO5zydfqwpYnWQJ7jJ
  voice_ja_alt: NxfO5zydfqwpYnWQJ7jJ
  voice_ko: NxfO5zydfqwpYnWQJ7jJ
  # 느린 읽기. ElevenLabs 에는 속도 손잡이가 없어서 보통 속도를 받아
  # ffmpeg atempo 로 늦춘다 — 같은 문장에 글자 값을 두 번 내지 않는다.
  rate_slow: "-20%"
  fps: 12
  width: 1920
  height: 1080
  gap_short: 0.45
  gap_long: 1.6
  # 수면 팩은 더 천천히 숨 쉰다. 0.45초는 거기서 급하게 들린다.
  gap_sleep: 3.0
  # shadow_gap 은 (직전 일본어 음성 × shadow_mult) + shadow_pad 만큼이다.
  # 1.0배면 학습자가 아직 숨을 고르는 중에 다음 줄이 시작해 의미가 없다.
  shadow_mult: 1.5
  shadow_pad: 1.2

# situation_pack 이 도는 주제. 한 줄이 영상 한 편이고, include 는 문장
# 데이터의 topic 값이다. 원래 주제는 20~30개씩이라 한 편을 채우기에 모자라서
# 한 제목 아래 앉을 만큼 가까운 것끼리 묶었다.
#
# `name` 은 **기록용 이름**이다(published.csv 의 topic 칸, 재사용 상태).
# `search` 는 **시청자에게 보이는 말**이고 제목·소개 첫 줄에 들어간다.
#
# 둘을 나눈 이유: `name` 은 우리가 문장을 묶으려고 붙인 이름이라 검색어가
# 아니다. 「숙박·문제 해결 일본어 회화 표현 30개」를 검색하는 사람은 없고,
# 「사람·감정 일본어」도 없다. 사람이 실제로 치는 말은 「호텔 일본어」,
# 「여행 일본어」다. 이 채널에서 롱폼이 노출되는 길은 검색뿐이므로
# (channel_jp/lib/titles.py 의 숫자를 볼 것) 그 자리를 내부 이름으로
# 채우면 길이 닫힌다.
#
# `name` 을 바꿔 해결하지 않는 이유: 이미 발행된 published.csv 와 used.json
# 이 그 값을 쓰고 있어서, 바꾸면 예전 기록과 새 기록이 서로 다른 이름으로
# 같은 주제를 가리키게 된다.
topics:
  - name: 여행·교통
    search: 여행 일본어
    include: [교통·길찾기, 관광·여행]
  - name: 식당·쇼핑
    search: 식당 일본어
    include: [식당·카페, 쇼핑·계산]
  - name: 숙박·문제 해결
    search: 호텔 일본어
    include: [호텔·숙박, 긴급·문제]
  - name: 사람·감정
    search: 일본어 인사말
    include: [인사·기본, 감정·반응]
  - name: 생활·직장
    search: 생활 일본어
    include: [일상·생활, 직장·학교, 자기소개·사람, 숫자·시간]

packs:
  # 2026-09-29 부터 cron 이 만드는 유일한 팩. 나머지는 손 실행용으로만 남는다.
  #
  # @200-y3b 쪽에서 먼저 한 것을 옮겨 왔다(PR #31 · #32). 그쪽 근거: 짧은 팩을
  # 주 5편 냈더니 편당 조회수가 8~330회였고 같은 틀 제목끼리 서로를 잡아먹었다.
  # 참고한 @maltenglish 는 주 1편 · 70분 · 「왕초보 영어회화 100문장 | 생활 장면
  # 한 줄」 하나로 편당 수만~백만 회를 낸다.
  #
  # 이 채널에 그것이 더 맞는 이유가 하나 더 있다. 여기는 구독자가 7명이라
  # 롱폼이 노출되는 길이 **검색뿐**이고(README 의 「왜 롱폼이고」), 「왕초보
  # 일본어회화」는 사람이 실제로 치는 말이다. 반대로 상황별 팩의 「{topic}
  # 회화 표현 30개」는 검색어이기는 해도 한 편이 14분이라 시청 시간이 안 쌓인다.
  #
  # 구성도 @200-y3b 와 같다 — 100문장 한 바퀴, 그다음 한국어만 듣고 일본어로
  # 떠올리는 반복 훈련 한 바퀴.
  weekly_100:
    name: 왕초보 일본어회화 100문장
    # 2026-09-28 측정값이다. --offline 빌드가 주제별로 41.6~48.4분으로 나오고,
    # 이미 발행된 세 편(수면 150문장 2156초 · 상황별 30문장 740초 · 쉐도잉
    # 45문장 1230초)과 대조하면 실제 ElevenLabs 음성은 그 예측의 1.13~1.20배다.
    # 그래서 실제 길이는 48~56분으로 본다.
    #
    # **60~70분이 아니다.** 같은 레시피·같은 100문장인 @200-y3b 영어판은 66분인데,
    # 일본어 문장이 영어보다 짧아서(ja 평균 7.7~9.8자) 여기서는 그만큼 안 나온다.
    # 늘리려면 무음이 아니라 **문장 수**를 늘려야 하지만, 주제별 풀이 140~155개라
    # 100개를 넘기면 두 바퀴째에 거의 전부가 재사용이 된다. 그래서 100 으로 뒀다.
    #
    # target_minutes 는 이름표가 아니라 **검사 기준**이다 — build.py 가 완성된
    # 영상과 30% 넘게 어긋나면 발행을 멈춘다. 52분이면 36~68분까지 통과한다.
    target_minutes: 52
    phrase_count: 100
    schedule: 매주 일요일
    playlist: 왕초보 일본어회화 100문장
    # 검색어를 맨 앞에. {round} 는 같은 주제가 두 바퀴째 돌 때 " 2탄" 이 되고,
    # 그것이 **제목이 한 번도 겹치지 않게 하는 장치**다(lib/titles.py 머리).
    # 100자를 넘으면 build.py 가 멈춘다 — 뒤 조각을 버리면 "(한글 발음 포함)"
    # 이라는 약속과 회차 표시가 같이 사라지므로, 여기서는 자르면 안 된다.
    title: "왕초보 일본어회화 {count}문장{round} | {hook} | {minutes}분 흘려듣기 (한글 발음 포함)"
    tags: [왕초보일본어, 기초일본어회화, 일본어회화100문장, 일본어흘려듣기, 한글발음일본어, 일본어듣기, 시니어일본어]
    hook: "오늘의 주제는 {topic}. 일본어 문장 {count}개를 짧은 것부터 차례로 들려드립니다."
    howto: |-
      1부 — 일본어 → 한국어 뜻 → 느린 일본어 → 따라 말하기 → 예문 → 한 번 더 따라 말하기.
      2부 반복 훈련 — 한국어만 먼저 나옵니다. 일본어로 떠올려 말해 본 뒤 정답을 들으세요.
      모든 문장에 한글 발음을 달았습니다. 처음엔 발음을 보며 따라 하고, 익숙해지면 일본어만 보세요.
      요리·산책·출퇴근할 때 틀어 두기만 해도 됩니다. 화면을 안 봐도 되게 만들었습니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 오늘은 일본어 문장 백 개를 짧은 것부터 차례로 들어 볼게요. 이어서 한국어만 듣고 일본어로 말해 보는 반복 훈련도 있으니 끝까지 함께해 주세요.
    outro_ko: 오늘 백 문장, 정말 수고하셨습니다. 한 번에 다 외우지 않아도 괜찮아요. 매주 일요일 아침에 새 백 문장으로 찾아올게요. 구독해 두시면 놓치지 않으실 거예요.
    # 한 바퀴 8주. `name` 은 기록용(published.csv 의 topic 칸), `search` 는
    # 화면과 썸네일에 보이는 말이다 — 위 topics 의 주석과 같은 이유로 나눴다.
    #
    # **주제마다 풀이 100문장을 넘어야 한 편이 찬다.** 지금 140~155개다
    # (모자라면 build.py 가 경고하고 그만큼 짧게 낸다). 12개 주제에서 골라
    # 묶었고, 일상·생활과 자기소개·사람과 숫자·시간은 두 곳에 들어간다.
    themes:
      - name: 생활·시간
        search: 생활 일본어
        include: [일상·생활, 숫자·시간]
        hook: 매일 쓰는 생활 일본어, 틀어두면 입에 붙어요
      - name: 여행·관광
        search: 여행 일본어
        include: [교통·길찾기, 관광·여행]
        hook: 공항부터 호텔까지 해외여행 일본어 한 번에
      - name: 숙박·문제 해결
        search: 호텔 일본어
        include: [호텔·숙박, 긴급·문제]
        hook: 호텔 체크인부터 문제 해결까지
      - name: 식당·쇼핑
        search: 식당 일본어
        include: [식당·카페, 쇼핑·계산]
        hook: 식당·카페·쇼핑에서 바로 쓰는 일본어
      - name: 인사·사람
        search: 일본어 인사말
        include: [인사·기본, 자기소개·사람]
        hook: 인사부터 자기소개까지 처음 만나서 쓰는 말
      - name: 기초 회화
        search: 기초 일본어
        include: [인사·기본, 일상·생활]
        hook: 짧은 문장부터 따라 말하는 기초 일본어
      - name: 직장·학교
        search: 직장 일본어
        include: [직장·학교, 숫자·시간]
        hook: 회사에서 매일 쓰는 직장 일본어
      - name: 감정·반응
        search: 감정 일본어
        include: [감정·반응, 자기소개·사람]
        hook: 기쁨·놀람·공감 감정 표현 일본어
    # 한 팩에 레시피가 여러 바퀴다. 첫 바퀴만 어느 문장이 살아남는지 정한다 —
    # 뒤 바퀴에서 합성이 실패하면 그 바퀴에서만 빠진다.
    parts:
      - recipe:
          - ja_normal
          - ko
          - ja_slow
          - shadow_gap
          - example_ja
          - example_ko
          - ja_normal
          - shadow_gap
          - gap_long
      # 같은 문장을 반대 방향으로 한 번 더. 1부는 일본어 → 뜻, 2부는 뜻 →
      # 일본어다. 떠올리는 쪽이 실제 말하기에 가깝고, 같은 소리를 그대로
      # 되풀이하는 것이 아니라서 반복 콘텐츠로 읽히지도 않는다.
      - label: 반복 훈련 · 듣고 일본어로 말하기
        chapters: part
        recipe:
          - ko
          - recall_gap
          - ja_normal
          - shadow_gap
          - gap_short

  sleep_japanese:
    name: 자기 전 일본어
    target_minutes: 40
    # 이 채널에서 시청 시간이 가장 잘 쌓이는 형식이다. 사람들이 틀어 놓고
    # 잔다. 길이는 많은 문장을 느긋하게 지나가며 버는 것이지, 적은 문장을
    # 무음으로 늘려서 버는 것이 아니다.
    phrase_count: 150
    schedule: 매주 금요일
    playlist: 자면서 듣는 일본어
    # 검색어를 맨 앞에. {focus} 는 이 편에 실제로 많이 든 주제라 편마다
    # 다르다 — 예전 틀은 {count}·{minutes} 가 고정이라 **평생 두 가지 제목만**
    # 냈다. 왜 그것이 문제인지는 lib/titles.py 머리에 숫자로 있다.
    title: "자면서 듣는 일본어 {count}문장 | {focus} 편 · 잠들기 전 흘려듣기 {minutes}분"
    tags: [자면서듣는일본어, 잠들기전일본어, 수면일본어, 일본어흘려듣기, 일본어듣기]
    hook: "잠들기 전에 틀어 두는 {minutes}분 일본어 듣기입니다. 문장 {count}개."
    howto: |-
      따라 말하지 않으셔도 됩니다. 볼륨을 낮추고 그냥 틀어 두세요.
      갑자기 커지는 소리나 배경 음악이 없어 잠을 깨우지 않습니다.
      외우려 하지 말고 흘려보내세요. 익숙해지는 것이 목적입니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 편안하게 흘려듣는 일본어예요. 따라 말하지 않으셔도 됩니다. 그냥 틀어 두고 쉬세요.
    outro_ko: 오늘도 고생 많으셨습니다. 편안한 밤 되세요.
    recipe:
      - ja_normal
      - gap_short
      - ko
      - gap_short
      - ja_slow
      - gap_sleep
      - ja_normal
      - gap_sleep

  sleep_japanese_long:
    name: 자기 전 일본어 3시간
    target_minutes: 180
    # 40분짜리는 시청자가 아직 자는 중에 끝난다. 밤새 틀어 두는 한 번이
    # sleep_japanese 다섯 번 값이다. 길이는 같은 음성을 되풀이하지 않고
    # 문장을 늘려서 번다 — 되풀이한 파일은 수익화 심사에서 반복 콘텐츠로
    # 읽힌다. 글자 값은 워크플로의 음성 캐시(actions/cache)가 줄인다:
    # 한 번 합성한 문장은 다음 회차부터 돈이 안 든다.
    phrase_count: 700
    schedule: 매주 토요일
    playlist: 자면서 듣는 일본어
    # 예전 틀은 바뀌는 값이 하나도 없어 **평생 한 가지 제목**이었다.
    title: "자면서 듣는 일본어 3시간 | {focus} 편 · 밤새 틀어 두는 일본어 {count}문장"
    tags: [자면서듣는일본어, 수면일본어, 일본어흘려듣기, 잠잘때듣는일본어, 일본어3시간]
    hook: "잠들기 전에 틀어 두는 {minutes}분 일본어 듣기입니다. 문장 {count}개가 겹치지 않고 이어집니다."
    howto: |-
      따라 말하지 않으셔도 됩니다. 볼륨을 낮추고 그냥 틀어 두세요.
      갑자기 커지는 소리나 배경 음악이 없어 잠을 깨우지 않습니다.
      밤새 틀어 두셔도 같은 문장이 반복되지 않습니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 세 시간 동안 편안하게 흘려듣는 일본어예요. 따라 말하지 않으셔도 됩니다. 그냥 틀어 두고 주무세요.
    outro_ko: 오늘도 고생 많으셨습니다. 편안한 밤 되세요.
    recipe:
      - ja_normal
      - gap_short
      - ko
      - gap_short
      - ja_slow
      - gap_sleep
      - ja_normal
      - gap_sleep

  situation_pack:
    name: 상황별 일본어
    target_minutes: 14
