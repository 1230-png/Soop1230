# 「귀트는 일본어」롱폼 레시피.
#
# 왜 롱폼인가: 숏폼 시청 시간은 파트너 프로그램의 3,000시간에 집계되지 않는다.
# 숏폼을 아무리 올려도 그 숫자는 0에서 움직이지 않는다. 머니로직이 28일에
# 조회수 8,414회를 받고도 시청 시간이 14.8시간이었던 이유가 그것이다.
#
# 영상 길이는 phrase_count 가 정한다. target_minutes 는 이름표일 뿐이라
# build.py 가 완성된 영상과 대조해서 30% 넘게 어긋나면 **멈춘다**(영어판은
# 경고만 했다). 길이는 문장을 더 넣어서 버는 것이지 무음을 늘려서 버는 것이
# 아니다 — 죽은 시간으로 채운 영상은 지속률이 무너지고, 시청 시간이 오느냐
# 마느냐를 정하는 것이 지속률이다.

defaults:
  # ElevenLabs. 키는 ELEVENLABS_API_KEY 환경변수로만 들어온다.
  # 키가 없으면 멈춘다 — 다른 엔진으로 되돌아가지 않는다(lib/tts.py 참고).
  engine: elevenlabs
  # 일본어와 한국어를 같은 목소리가 읽는다. 나눌 일이 생기면 voice_ko 만
  # 다른 ID 로 바꾸면 되고 코드는 안 건드려도 된다.
  voice_ja: NxfO5zydfqwpYnWQJ7jJ
  voice_ja_alt: NxfO5zydfqwpYnWQJ7jJ
  voice_ko: NxfO5zydfqwpYnWQJ7jJ
  # 느린 읽기. ElevenLabs 에는 속도 손잡이가 없어서 보통 속도를 받아
  # ffmpeg atempo 로 늦춘다 — 같은 문장에 글자 값을 두 번 내지 않는다.
  rate_slow: "-20%"
  fps: 12
  width: 1920
  height: 1080
  gap_short: 0.45
  gap_long: 1.6
  # 수면 팩은 더 천천히 숨 쉰다. 0.45초는 거기서 급하게 들린다.
  gap_sleep: 3.0
  # shadow_gap 은 (직전 일본어 음성 × shadow_mult) + shadow_pad 만큼이다.
  # 1.0배면 학습자가 아직 숨을 고르는 중에 다음 줄이 시작해 의미가 없다.
  shadow_mult: 1.5
  shadow_pad: 1.2

# situation_pack 이 도는 주제. 한 줄이 영상 한 편이고, include 는 문장
# 데이터의 topic 값이다. 원래 주제는 20~30개씩이라 한 편을 채우기에 모자라서
# 한 제목 아래 앉을 만큼 가까운 것끼리 묶었다.
topics:
  - name: 여행·교통
    include: [교통·길찾기, 관광·여행]
  - name: 식당·쇼핑
    include: [식당·카페, 쇼핑·계산]
  - name: 숙박·문제 해결
    include: [호텔·숙박, 긴급·문제]
  - name: 사람·감정
    include: [인사·기본, 감정·반응]
  - name: 생활·직장
    include: [일상·생활, 직장·학교, 자기소개·사람, 숫자·시간]

packs:
  sleep_japanese:
    name: 자기 전 일본어
    target_minutes: 40
    # 이 채널에서 시청 시간이 가장 잘 쌓이는 형식이다. 사람들이 틀어 놓고
    # 잔다. 길이는 많은 문장을 느긋하게 지나가며 버는 것이지, 적은 문장을
    # 무음으로 늘려서 버는 것이 아니다.
    phrase_count: 150
    schedule: 매주 금요일
    playlist: 자면서 듣는 일본어
    title: "잠들기 전 일본어 듣기 {minutes}분 | 자면서 듣는 일본어 회화 {count}문장"
    tags: [자면서듣는일본어, 잠들기전일본어, 수면일본어, 일본어흘려듣기, 일본어듣기]
    hook: "잠들기 전에 틀어 두는 {minutes}분 일본어 듣기입니다. 문장 {count}개."
    howto: |-
      따라 말하지 않으셔도 됩니다. 볼륨을 낮추고 그냥 틀어 두세요.
      갑자기 커지는 소리나 배경 음악이 없어 잠을 깨우지 않습니다.
      외우려 하지 말고 흘려보내세요. 익숙해지는 것이 목적입니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 편안하게 흘려듣는 일본어예요. 따라 말하지 않으셔도 됩니다. 그냥 틀어 두고 쉬세요.
    outro_ko: 오늘도 고생 많으셨습니다. 편안한 밤 되세요.
    recipe:
      - ja_normal
      - gap_short
      - ko
      - gap_short
      - ja_slow
      - gap_sleep
      - ja_normal
      - gap_sleep

  sleep_japanese_long:
    name: 자기 전 일본어 3시간
    target_minutes: 180
    # 40분짜리는 시청자가 아직 자는 중에 끝난다. 밤새 틀어 두는 한 번이
    # sleep_japanese 다섯 번 값이다. 길이는 같은 음성을 되풀이하지 않고
    # 문장을 늘려서 번다 — 되풀이한 파일은 수익화 심사에서 반복 콘텐츠로
    # 읽힌다. 글자 값은 워크플로의 음성 캐시(actions/cache)가 줄인다:
    # 한 번 합성한 문장은 다음 회차부터 돈이 안 든다.
    phrase_count: 700
    schedule: 매주 토요일
    playlist: 자면서 듣는 일본어
    title: "잠들기 전 일본어 3시간 | 자면서 듣는 일본어 회화 {count}문장 · 틀어 두고 주무세요"
    tags: [자면서듣는일본어, 수면일본어, 일본어흘려듣기, 잠잘때듣는일본어, 일본어3시간]
    hook: "잠들기 전에 틀어 두는 {minutes}분 일본어 듣기입니다. 문장 {count}개가 겹치지 않고 이어집니다."
    howto: |-
      따라 말하지 않으셔도 됩니다. 볼륨을 낮추고 그냥 틀어 두세요.
      갑자기 커지는 소리나 배경 음악이 없어 잠을 깨우지 않습니다.
      밤새 틀어 두셔도 같은 문장이 반복되지 않습니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 세 시간 동안 편안하게 흘려듣는 일본어예요. 따라 말하지 않으셔도 됩니다. 그냥 틀어 두고 주무세요.
    outro_ko: 오늘도 고생 많으셨습니다. 편안한 밤 되세요.
    recipe:
      - ja_normal
      - gap_short
      - ko
      - gap_short
      - ja_slow
      - gap_sleep
      - ja_normal
      - gap_sleep

  situation_pack:
    name: 상황별 일본어
    target_minutes: 14
    phrase_count: 30
    schedule: 매주 화요일
    playlist: 상황별 일본어 표현
    title: "{topic} 일본어 회화 표현 {count}개 | 상황별 일본어 {minutes}분"
    tags: [상황별일본어, 여행일본어, 일본어회화, 생활일본어, 일본어표현정리]
    hook: "{topic} 상황에서 바로 쓰는 일본어 회화 표현 {count}개입니다."
    howto: |-
      상황이 닥쳤을 때 생각하지 않고 나오도록, 문장을 통째로 익히는 편이 빠릅니다.
      예문까지 같이 들으면 어떤 맥락에서 쓰는 말인지 감이 잡힙니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 오늘은 상황별 표현이에요. 실제로 그 상황에 놓였을 때 바로 나오도록, 문장을 통째로 익혀 보세요.
    outro_ko: 오늘 표현들이 실제 상황에서 도움이 되길 바랍니다. 구독해 두시면 다음 상황편을 놓치지 않으실 거예요.
    recipe:
      - ja_normal
      - ko
      - ja_slow
      - shadow_gap
      - example_ja
      - example_ko
      - ja_normal
      - shadow_gap
      - gap_long

  shadowing_drill:
    name: 쉐도잉 트레이닝
    target_minutes: 24
    phrase_count: 45
    schedule: 매주 목요일
    playlist: 일본어 쉐도잉
    title: "일본어 쉐도잉 연습 {count}문장 | 따라 말하기 {minutes}분"
    tags: [일본어쉐도잉, 쉐도잉연습, 일본어따라말하기, 일본어스피킹, 일본어발음]
    hook: "일본어 문장 {count}개를 따라 말하는 {minutes}분 쉐도잉 연습입니다."
    howto: |-
      문장이 끝나고 빈 구간이 나오면 소리 내어 따라 말하세요.
      눈으로 읽는 것과 입으로 내는 것은 다른 연습입니다. 소리를 꼭 내세요.
      한 문장을 세 번씩 반복하니 처음부터 완벽하지 않아도 됩니다.
    intro_ko: 안녕하세요, 귀트는 일본어입니다. 오늘은 쉐도잉 훈련이에요. 일본어 문장이 나온 뒤 빈 구간이 나오면, 소리 내어 따라 말해 보세요.
    outro_ko: 수고하셨습니다. 매일 십 분씩만 따라 하셔도 입이 트입니다. 다음 훈련에서 또 만나요.
    # 한 문장을 세 번 지나가고 매번 빈 구간을 둔다. 여기서 반복은 분량이
    # 아니라 연습 그 자체다.
    recipe:
      - ja_normal
      - shadow_gap
      - ko
      - ja_slow
      - shadow_gap
      - ja_normal
      - shadow_gap
      - example_ja
      - shadow_gap
      - gap_long
