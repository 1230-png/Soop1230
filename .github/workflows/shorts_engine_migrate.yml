name: 🗄 Shorts Engine - DB 마이그레이션 / 시드

# 수동 전용. DATABASE_URL 시크릿을 써서 Neon에 스키마를 올린다.
# 접속 문자열을 사람이 채팅이나 로그로 옮길 필요가 없게 하려는 워크플로다.
on:
  workflow_dispatch:
    inputs:
      run_seed:
        description: '기존 콘텐츠 60편을 큐에 적재'
        type: boolean
        default: true
      downgrade_first:
        description: '⚠️ 기존 테이블을 모두 지우고 새로 만들기 (데이터 삭제됨)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        working-directory: shorts_engine
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary

      - name: 접속 확인
        working-directory: shorts_engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL 시크릿이 없습니다."
            echo "Settings → Secrets and variables → Actions 에서 등록하세요."
            echo "형식: postgresql+asyncpg://user:pw@ep-xxx-pooler.region.aws.neon.tech/dbname?ssl=require"
            exit 1
          fi
          # 값 자체는 절대 출력하지 않는다. 호스트만 확인한다.
          python3 - <<'PY'
          import os, re
          url = os.environ["DATABASE_URL"]
          if not url.startswith("postgresql+asyncpg://"):
              raise SystemExit(
                  "::error::드라이버가 잘못됐습니다. postgresql:// 를 "
                  "postgresql+asyncpg:// 로 바꾸세요."
              )
          host = re.sub(r"^.*@", "", url).split("/")[0]
          print(f"대상 호스트: {host}")
          print("풀링 엔드포인트:", "예" if "-pooler" in host else "아니오 (직접 연결 — 풀링 권장)")
          PY

      - name: ⚠️ 기존 스키마 삭제
        if: inputs.downgrade_first
        working-directory: shorts_engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -m alembic downgrade base

      - name: 마이그레이션
        working-directory: shorts_engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 -m alembic upgrade head

      - name: 시드 적재
        if: inputs.run_seed
        working-directory: shorts_engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/seed.py

      - name: 결과 확인
        working-directory: shorts_engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import asyncio, sys
          sys.path.insert(0, ".")
          from sqlalchemy import text
          from app.db import SessionLocal

          async def main():
              async with SessionLocal() as s:
                  rows = await s.execute(text("""
                      SELECT tc.label_ko, count(sc.id) AS n
                      FROM topic_categories tc
                      LEFT JOIN scripts sc ON sc.topic_category_id = tc.id
                      GROUP BY tc.label_ko ORDER BY tc.label_ko
                  """))
                  print("\n카테고리별 대기 대본:")
                  for r in rows:
                      print(f"  {r.label_ko:12} {r.n}편")
                  total = await s.scalar(text("SELECT count(*) FROM scripts WHERE status='pending'"))
                  print(f"\n큐 대기: {total}편")
                  v = await s.scalar(text("SELECT count(*) FROM videos"))
                  print(f"기록된 영상: {v}편")
          asyncio.run(main())
          PY
