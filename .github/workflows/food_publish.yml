name: Auto-publish 음식 쇼츠 (@Food)

on:
  schedule:
    # 4 shorts/day: 09:00 / 15:00 / 18:00 / 21:00 KST
    # = 00:00 / 06:00 / 09:00 / 12:00 UTC
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: "YouTube privacy status for this run"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]

env:
  DEFAULT_PRIVACY_STATUS: public

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, Korean font)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r channel_food/scripts/requirements.txt

      - name: Generate food short video
        id: generate
        working-directory: channel_food/scripts
        run: |
          python3 generate_food_video.py > result.json
          cat result.json
          VIDEO_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['video_path'])")
          METADATA_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['metadata_path'])")
          echo "video_path=${VIDEO_PATH}" >> "$GITHUB_OUTPUT"
          echo "metadata_path=${METADATA_PATH}" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        working-directory: channel_food/scripts
        env:
          FOOD_CLIENT_ID: ${{ secrets.FOOD_CLIENT_ID }}
          FOOD_CLIENT_SECRET: ${{ secrets.FOOD_CLIENT_SECRET }}
          FOOD_REFRESH_TOKEN: ${{ secrets.FOOD_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 upload_food_video.py \
            --video-path "${{ steps.generate.outputs.video_path }}" \
            --metadata-path "${{ steps.generate.outputs.metadata_path }}" \
            --privacy-status public

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_food/used_log.csv
          git diff --cached --quiet || git commit -m "Auto-publish: Food short"
          git push
