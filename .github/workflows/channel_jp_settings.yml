name: 귀트는 일본어 — 채널 설명·키워드

# cron 이 없다. 채널 설명은 한 번 정하면 자주 바꿀 것이 아니고, 자주 바꾸면
# 검색에서 손해만 본다.
#
# 올리는 것이 없다. 채널의 brandingSettings 만 고친다 — 영상도 재생목록도
# 건드리지 않는다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "무엇이 바뀌는지만 본다 (보내지 않는다)"
        required: true
        type: boolean
        default: true
      force:
        # 기본이 거짓인 이유: 사람이 손으로 적어 둔 값을 코드가 덮어쓰면,
        # 그 사람은 자기가 무엇을 잃었는지도 모른 채 되돌려야 한다.
        description: "이미 적혀 있어도 덮어쓴다"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: channel-jp-settings
  cancel-in-progress: false

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 의존성
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r channel_jp/requirements.txt
          pip install --quiet ruff==0.6.9 pytest==8.3.3

      # 라이브 채널을 고치기 전에 검사를 둔다. 돈이 드는 자리는 아니지만
      # 되돌리기가 번거로운 자리다 — 규칙은 같다(CLAUDE.md).
      - name: 코드 검사
        run: ruff check channel_jp/

      - name: 테스트
        working-directory: channel_jp
        run: python -m pytest -q

      - name: 채널 설정 넣기
        env:
          # 이 채널 전용이다. 공용 YT_* 를 넘기지 않는다 — 대체 경로를 열어
          # 두면 시크릿을 빠뜨렸을 때 **남의 채널 설명이 갈린다.**
          MV_CLIENT_ID: ${{ secrets.MV_CLIENT_ID }}
          MV_CLIENT_SECRET: ${{ secrets.MV_CLIENT_SECRET }}
          MV_REFRESH_TOKEN: ${{ secrets.MV_REFRESH_TOKEN }}
          MV_CHANNEL_ID: ${{ secrets.MV_CHANNEL_ID }}
        run: |
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args="$args --force"
          fi
          echo "::notice::channel_settings.py $args"
          python3 channel_jp/channel_settings.py $args | tee "$GITHUB_STEP_SUMMARY"
