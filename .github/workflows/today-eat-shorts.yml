name: Auto-publish 오늘뭐먹지-f2d 쇼츠

on:
  schedule:
    # 4 shorts/day: 03:00 / 06:00 / 09:00 / 12:00 UTC = 12:00 / 15:00 / 18:00 / 21:00 KST
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: "YouTube privacy status for this run"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]

env:
  DEFAULT_PRIVACY_STATUS: public

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, Korean font)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r today_eat/scripts/requirements.txt

      - name: Generate today's short
        id: generate
        working-directory: today_eat
        run: |
          video_id=$(python3 scripts/generate_video.py)
          echo "video_id=$video_id" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        working-directory: today_eat
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          privacy="${{ github.event.inputs.privacy_status || env.DEFAULT_PRIVACY_STATUS }}"
          python3 scripts/upload_video.py --video-id "${{ steps.generate.outputs.video_id }}" --privacy-status "$privacy"

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today_eat/used_log.csv
          git diff --cached --quiet || git commit -m "Auto-publish: ${{ steps.generate.outputs.video_id }}"
          git push
