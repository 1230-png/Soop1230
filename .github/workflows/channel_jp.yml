name: 귀트는 일본어 — 롱폼 한 편

# 주 3편을 무인으로 발행한다. 다섯 편을 손으로 내 보고 걸었다.
#
# 머니로직은 사람 확인 없이 여드레 동안 공개 발행했고, 그동안 제목에 `nan%`
# 가 박힌 영상이 그대로 나갔다. 이 채널에 cron 을 걸기 전에 다섯 편(수면 3 ·
# 상황별 2)을 손으로 내 보고, 목소리와 화면과 길이를 확인했다.
#
# **남는 위험은 소리다.** 발행을 막는 것은 verify_publishable 하나인데 그것이
# 보는 것은 깨진 값·빈 문장·길이이고, 무음 35분은 전부 통과한다. 되돌리려면
# 아래 schedule 을 지우면 된다 — workflow_dispatch 는 그대로 남는다.
#
# 손으로 돌릴 때의 기본값이 `--offline` 인 것은 실수로 버튼을 눌러도 돈이
# 나가지 않게 하려는 것이다. cron 은 아래에서 따로 정한다.
on:
  schedule:
    # KST = UTC+9 라 21:00 KST = 12:00 UTC (같은 날)이다.
    # 요일은 packs.yaml 의 schedule 과 맞춘다. 어느 cron 이 어느 팩인지는
    # 아래 「이번 회차 설정」의 case 가 정한다 — 여기만 고치면 안 된다.
    - cron: "0 12 * * 2"    # 화 21:00 KST — 상황별 (14분)
    - cron: "0 12 * * 4"    # 목 21:00 KST — 쉐도잉 (24분)
    - cron: "0 12 * * 5"    # 금 21:00 KST — 수면 (40분)
  workflow_dispatch:
    inputs:
      pack:
        description: "어느 팩"
        required: true
        type: choice
        default: situation_pack
        options:
          - situation_pack
          - shadowing_drill
          - sleep_japanese
      limit:
        # string 이 아니라 choice 다. 빈 칸으로 "팩 기본값"을 뜻하게 했더니
        # 실제로는 그 뜻이 전달되지 않았다 — 빈 값을 넘기면 GitHub 이 여기
        # default 를 도로 끼워 넣어서, 150문장을 시켰는데 10문장이 나왔다.
        # 고르는 값으로 두면 "전체"를 빈 칸으로 말할 일이 없다.
        description: "문장 수"
        required: true
        type: choice
        default: "10"
        options:
          - "10"
          - "30"
          - 전체
      dry_run:
        description: "무음으로 만든다 (ElevenLabs 를 부르지 않는다)"
        required: true
        type: boolean
        default: true
      upload:
        description: "유튜브에 올린다"
        required: true
        type: boolean
        default: false
      privacy:
        # 기본이 public 이다. 세 편을 내 보고 정했다.
        #
        # 한동안 private 이었고 근거는 머니로직이었다 — 그 채널은 사람 확인
        # 없이 공개로 여드레 동안 제목에 nan% 가 박힌 영상을 냈다. 다만 그
        # 장치가 막으려던 것은 **무인 발행**이고, 이 워크플로에는 cron 이
        # 없다. 누군가 버튼을 누르지 않으면 한 편도 나가지 않는다.
        #
        # 그리고 비공개 영상은 시청 시간이 0이다. 이 채널이 쌓으려는 것이
        # 바로 그것이라, 확인을 기다리며 쌓아 두는 쪽에도 대가가 있었다.
        #
        # **사람이 영상을 보고 공개하던 단계가 이제 없다.** 발행을 막는 것은
        # verify_publishable 하나뿐이고(빌드 뒤·업로드 직전 두 번), 그것이
        # 보는 것은 깨진 값·빈 문장·길이다. **소리가 나는지는 아무도 보지
        # 않는다** — 무음 35분도 이 검사를 전부 통과한다. 되돌리려면 이
        # 기본값을 private 으로 바꾸면 된다.
        description: "공개 설정"
        required: true
        type: choice
        default: public
        options:
          - public
          - unlisted
          - private

# used.json 을 저장소에 되돌려 놓아야 한다(아래 「쓴 문장을 기록에 남기기」).
# 유튜브 쪽 권한과는 상관없다 — 이것은 GITHUB_TOKEN 이 이 저장소에 커밋할
# 수 있느냐는 것이고, run_shorts.yml · longform.yml 이 같은 이유로 같다.
permissions:
  contents: write

concurrency:
  group: channel-jp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 스텝의 `if:` 는 그 스텝 자신의 env 를 못 읽고, secrets 문맥은 스텝
      # `if:` 에서 쓸 수 있는 것으로 문서에 없다. 잡 수준 env 는 된다.
      HAS_VOICE_KEY: ${{ secrets.ELEVENLABS_API_KEY != '' }}
      HAS_YT_CREDS: ${{ secrets.MV_REFRESH_TOKEN != '' }}

    steps:
      # **cron 은 inputs 를 주지 않는다.** schedule 로 들어오면 inputs.* 가
      # 전부 빈 값이고, 그대로 쓰면 upload 가 거짓이 되어 **글자 값은 다 쓰고
      # 영상은 안 올라간다.** 어느 경로로 들어왔든 여기서 한 번에 정하고,
      # 아래는 inputs 가 아니라 이 단계의 출력만 본다.
      - name: 이번 회차 설정
        id: run
        run: |
          set -e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 12 * * 2") pack=situation_pack ;;
              "0 12 * * 4") pack=shadowing_drill ;;
              "0 12 * * 5") pack=sleep_japanese ;;
              *)
                echo "::error::모르는 스케줄 '${{ github.event.schedule }}' — on.schedule 을 고쳤으면 이 case 도 같이 고칠 것. 짐작해서 만들지 않는다."
                exit 1 ;;
            esac
            limit=전체
            dry_run=false
            upload=true
            privacy=public
          else
            pack="${{ inputs.pack }}"
            limit="${{ inputs.limit }}"
            dry_run="${{ inputs.dry_run }}"
            upload="${{ inputs.upload }}"
            privacy="${{ inputs.privacy }}"
          fi
          {
            echo "pack=$pack"
            echo "limit=$limit"
            echo "dry_run=$dry_run"
            echo "upload=$upload"
            echo "privacy=$privacy"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$pack · limit=$limit · dry_run=$dry_run · upload=$upload · privacy=$privacy"

      - uses: actions/checkout@v4
        with:
          # 아래 기록 단계가 `git pull --rebase` 를 한다. 얕은 클론이면
          # 그 자리에서 어긋난다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 폰트와 ffmpeg
        run: |
          sudo apt-get update -qq
          # fonts-noto-cjk 가 없으면 일본어가 통째로 □ 로 나간다. 러너에
          # 깔려 있는 나눔고딕에는 가나도 한자도 없다 — cards.py 의
          # find_font() 가 그것을 확인하고 멈추므로 영상이 나오지는 않지만,
          # 여기서 깔아 두는 편이 빠르다.
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: 파이썬 의존성
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r channel_jp/requirements.txt
          # 검사 도구는 requirements.txt 에 없다. 그쪽은 영상을 만드는 데
          # 실제로 필요한 것만 담는다 — 여기서 따로 깐다.
          #
          # 버전을 고정한다. 안 그러면 새 판이 규칙을 추가한 날 아침, 코드를
          # 건드리지도 않았는데 발행이 멈춘다.
          pip install --quiet ruff==0.6.9 pytest==8.3.3

      # 돈이 드는 단계 앞에 검사를 둔다(CLAUDE.md). 깨진 코드로 ElevenLabs
      # 를 부르면 글자 값은 그대로 나가고 영상은 안 나온다.
      # **이 두 스텝을 뒤로 옮기지 말 것.**
      - name: 코드 검사
        run: ruff check channel_jp/

      - name: 테스트
        working-directory: channel_jp
        run: python -m pytest -q

      - name: 문장 은행 검사
        run: python3 channel_jp/build_bank.py --check

      - name: 키 확인
        if: ${{ steps.run.outputs.dry_run != 'true' }}
        run: |
          if [ "${HAS_VOICE_KEY}" != "true" ]; then
            echo "::error::ELEVENLABS_API_KEY 가 없다. 저장소 시크릿에 넣을 것."
            exit 1
          fi

      # 문장을 줄여 만든 영상은 제목이 "40분"인데 길이가 2분이라 upload.py
      # 가 발행을 거절한다. 거절 자체는 맞지만, 그 거절이 글자 값을 다 쓰고
      # 난 **뒤에** 나온다. 실제로 한 번 그렇게 버렸다.
      - name: 줄인 영상은 올릴 수 없다
        if: ${{ steps.run.outputs.upload == 'true' && steps.run.outputs.dry_run != 'true' && steps.run.outputs.limit != '전체' }}
        run: |
          echo "::error::limit=${{ steps.run.outputs.limit }} 로는 올릴 수 없다 — 팩 길이에 못 미쳐 upload.py 가 어차피 막는다. 올리려면 limit 을 '전체' 로 둘 것."
          exit 1

      - name: 영상 만들기
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -e
          args="--pack ${{ steps.run.outputs.pack }}"
          if [ "${{ steps.run.outputs.limit }}" != "전체" ]; then
            args="$args --limit ${{ steps.run.outputs.limit }}"
          fi
          if [ "${{ steps.run.outputs.dry_run }}" = "true" ]; then
            args="$args --offline"
          fi
          echo "::notice::build.py $args"
          # 표준 출력의 유일한 줄이 빌드 폴더다.
          out_dir=$(python3 channel_jp/build.py $args)
          echo "BUILD_DIR=$out_dir" >> "$GITHUB_ENV"

      - name: 결과 요약
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          meta = json.load(open(os.environ["BUILD_DIR"] + "/metadata.json",
                                encoding="utf-8"))
          print(f"## {meta['title']}\n")
          print(f"- 길이: **{meta['duration_seconds']/60:.1f}분**")
          print(f"- 문장: {len(meta['phrase_ids'])}개")
          # 이 단계는 올리기 **앞**이라 metadata 만 보면 언제나 private 이라고
          # 찍는다. 실제로 나갈 값은 입력 쪽에 있다.
          going_out = "${{ steps.run.outputs.upload }}" == "true"
          print(f"- 공개: `${{ steps.run.outputs.privacy }}`" if going_out
                else "- 공개: 올리지 않는다")
          print(f"\n<details><summary>설명란</summary>\n\n```\n"
                f"{meta['description']}\n```\n</details>")
          PY

      # 목소리를 들어 보려면 파일이 손에 와야 한다. 업로드를 끄고 돌렸을 때의
      # 유일한 확인 경로이기도 하다.
      - name: 결과물 내려받기용으로 붙이기
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run.outputs.pack }}-${{ github.run_number }}
          path: |
            ${{ env.BUILD_DIR }}/video.mp4
            ${{ env.BUILD_DIR }}/thumbnail.png
            ${{ env.BUILD_DIR }}/metadata.json
          retention-days: 7

      - name: 유튜브에 올리기
        if: ${{ steps.run.outputs.upload == 'true' && steps.run.outputs.dry_run != 'true' }}
        env:
          # 이 채널 전용이다. 공용 YT_* 는 넘기지 않는다 — 대체 경로를 열어
          # 두면 시크릿을 빠뜨렸을 때 조용히 남의 채널로 올라간다.
          #
          # MV_ 는 머니로직에서 온 글자지만 그 채널은 없다. 이름을 바꾼 것이지
          # 지운 것이 아니라서 같은 채널이 지금 「귀트는 일본어」다.
          MV_CLIENT_ID: ${{ secrets.MV_CLIENT_ID }}
          MV_CLIENT_SECRET: ${{ secrets.MV_CLIENT_SECRET }}
          MV_REFRESH_TOKEN: ${{ secrets.MV_REFRESH_TOKEN }}
          MV_CHANNEL_ID: ${{ secrets.MV_CHANNEL_ID }}
        run: |
          if [ "${HAS_YT_CREDS}" != "true" ]; then
            echo "::error::MV_REFRESH_TOKEN 이 없다. 올리지 않는다."
            exit 1
          fi
          python3 channel_jp/upload.py --dir "$BUILD_DIR" \
            --privacy "${{ steps.run.outputs.privacy }}"

      # build.py 가 used.json 에 "이 문장들을 썼다"고 적지만 그것은 러너 안의
      # 파일이고, 잡이 끝나면 러너와 함께 사라진다. 되돌려 놓지 않으면 다음
      # 회차가 같은 문장으로 같은 영상을 또 만든다. 첫 편(J001~J150)이 실제로
      # 이 단계가 없는 채로 나가서, 기록을 손으로 커밋해 메웠다.
      #
      # **올린 회차에만 적는다.** 만들기만 하고 올리지 않은 회차까지 적으면,
      # 세상에 나오지도 않은 영상에 문장 150개가 소모된 것으로 남는다. 앞
      # 단계가 실패하면 이 단계는 애초에 돌지 않는다(스텝 if 에는 success()
      # 가 기본으로 붙는다) — 업로드가 깨진 회차의 문장은 그대로 남는다.
      - name: 쓴 문장을 기록에 남기기
        if: ${{ steps.run.outputs.upload == 'true' && steps.run.outputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 둘은 다른 것을 센다. used.json 은 "어느 문장을 썼나"이고
          # published.csv 는 "어느 영상이 어느 팩이었나"다 — 뒤엣것이 없으면
          # 팩별 성적을 물을 자료가 없다.
          git add channel_jp/data/used.json channel_jp/data/published.csv
          if git diff --cached --quiet; then
            echo "::notice::기록에 바뀐 것이 없다."
            exit 0
          fi
          git commit -m "chore: channel_jp used.json 갱신 [skip ci]"
          # 다른 워크플로가 밤마다 같은 브랜치에 밀어 넣는다. 한 번 튕기는
          # 것은 정상이라, 다시 맞춰 보고 민다.
          for wait in 2 4 8 16; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "::warning::기록을 밀어 넣지 못했다 — ${wait}초 뒤 다시."
            sleep "${wait}"
          done
          echo "::error::기록을 남기지 못했다. 영상은 올라갔다 — channel_jp/data/ 의 used.json 과 published.csv 를 손으로 커밋할 것. 그러지 않으면 다음 회차가 같은 문장을 또 쓴다."
          exit 1

      - name: 올리지 않은 이유
        if: ${{ steps.run.outputs.upload != 'true' || steps.run.outputs.dry_run == 'true' }}
        run: |
          echo "::notice::유튜브에 올리지 않았다. 위 아티팩트를 내려받아 확인할 것."
