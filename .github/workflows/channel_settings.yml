name: Fill empty channel settings (@200-y3b)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite keywords/description even if already set"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  fill_settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r channel_200y3b/scripts/requirements.txt

      - name: Fill in empty branding fields
        working-directory: channel_200y3b
        env:
          # Y3B_* is this channel's own slot; YT_* is shared and has been
          # rotated out from under these calls before.
          Y3B_CLIENT_ID: ${{ secrets.Y3B_CLIENT_ID }}
          Y3B_CLIENT_SECRET: ${{ secrets.Y3B_CLIENT_SECRET }}
          Y3B_REFRESH_TOKEN: ${{ secrets.Y3B_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 scripts/update_channel_settings.py --force
          else
            python3 scripts/update_channel_settings.py
          fi
