name: Fill empty channel settings (@200-y3b)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fill_settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r channel_200y3b/scripts/requirements.txt

      - name: Fill in empty branding fields
        working-directory: channel_200y3b
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/update_channel_settings.py
