name: Product Review - Shorts Upload

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 KST
    - cron: '0 14 * * *' # 14:00 KST
    - cron: '0 20 * * *' # 20:00 KST
  workflow_dispatch:

jobs:
  product-review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        category: [electronics, home, fashion]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow google-auth-oauthlib google-api-python-client elevenlabs pydub

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate & Upload Product Review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          COUPANG_AFFILIATE_ID: ${{ secrets.COUPANG_AFFILIATE_ID }}
        run: |
          python product_review/scripts/fetch_products.py "${{ matrix.category }}" 3 | \
          python product_review/scripts/generate_review.py | \
          python product_review/scripts/generate_video.py | \
          python product_review/scripts/upload_review.py

      - name: Report results
        if: always()
        run: echo "✅ Product Review - ${{ matrix.category }} completed"
