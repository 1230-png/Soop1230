name: MoneyLogic 롱폼·숏폼 생성 (market-verify)

# PC 가 꺼져 있어도 돌아야 해서 여기(깃허브 러너)에서 만든다.
# 대본은 ANTHROPIC_API_KEY(유료 크레딧) 가 아니라 구독 토큰으로 쓴다.
#   1) 내 PC 에서: claude setup-token
#   2) 나온 토큰을 이 저장소 Secrets 에 CLAUDE_CODE_OAUTH_TOKEN 으로 넣는다
#
# **업로드까지 한다.** 형제 채널(run_shorts.yml)과 같은 방식이다. 돌 때마다 롱폼 1편과
# 숏폼이 사람 확인 없이 공개로 올라간다. 되돌리려면 유튜브 스튜디오에서 직접 지워야 한다.
# 아티팩트는 발행과 별개로 계속 남긴다.
#
# 자격 증명은 **이 채널 전용만** 쓴다. 공용 YT_* 로 떨어지지 않는다 — 대체 경로가
# 있으면 MV_* 를 빠뜨렸을 때 조용히 남의 자격 증명으로 올라간다. 틀린 채널에 올라간
# 영상은 사람이 손으로 지워야 한다. 없으면 없다고 말하고 멈춘다.
#   MV_CLIENT_ID / MV_CLIENT_SECRET / MV_REFRESH_TOKEN
#   MV_CHANNEL_ID  — 넣어 두면 다른 채널로 올라가는 사고를 upload.py 가 한 번 더 막는다
#
# 구글 클라우드 프로젝트도 이 채널 전용을 쓴다. 할당량이 채널이 아니라 프로젝트
# 단위라, 돌려쓰면 다른 채널의 몫을 깎는다.

on:
  schedule:
    # 매일 22:00 UTC = 한국 07:00. 전날 미국장 마감(06:00 KST) 뒤라 어제 움직임이 다 들어온다.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "소재 고르는 방식"
        type: choice
        options: [news, pool]
        default: news
      repeat:
        description: "만들 편수"
        default: "1"
      privacy:
        description: "공개 범위"
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  # 다룬 소재 기록(used_topics.csv)을 커밋해야 다음 회차가 같은 소재를 피한다.
  contents: write

concurrency:
  # 앞 회차가 아직 돌고 있으면 겹쳐 돌리지 않는다. 같은 소재를 두 번 만들 수 있다.
  group: moneylogic-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 시스템 준비물 (ffmpeg · 한글 폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 파이썬 패키지
        run: pip install -r market-verify/requirements.txt

      - name: 코드 검사 (깨진 코드가 공개로 올라가는 것을 막는다)
        working-directory: market-verify
        run: |
          # 여기는 크레딧도 소재 기록도 아직 안 쓴 지점이다. 자격 증명 검사를
          # 영상 만들기 전에 두는 것과 같은 이유로, 코드 검사도 여기 둔다 —
          # 실패하면 1~2 분 안에 깨끗하게 멈춘다.
          #
          # 이 검사가 없던 동안, 문법은 맞지만 깨진 코드가 사람 확인 없이
          # 공개로 발행될 수 있었다. 되돌리려면 유튜브 스튜디오에서 손으로
          # 지워야 한다.
          #
          # ruff 는 버전을 고정한다. 새 판이 규칙을 추가하면 코드를 건드리지
          # 않았는데도 어느 날 아침 발행이 멈춘다. 올릴 때는 사람이 올린다.
          pip install "ruff==0.15.8"
          ruff check src tests
          # pytest 는 requirements.txt 에 이미 있다. 위에서 ffmpeg 와 한글
          # 폰트를 깔았으므로 영상 조립 테스트까지 전부 돌아간다.
          python -m pytest -q

      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: 대본 작성 방식 결정
        id: llm
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 둘 중 있는 것을 쓴다. API 키가 있으면 그쪽이 확실하므로 먼저 본다.
          if [ -n "$API_KEY" ]; then
            echo "mode=api" >> "$GITHUB_OUTPUT"
            echo "대본: ANTHROPIC_API_KEY (크레딧 차감)"
          elif [ -n "$OAUTH" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
            echo "대본: CLAUDE_CODE_OAUTH_TOKEN (구독 사용량)"
          else
            echo "::error::대본을 쓸 자격 증명이 없다. 둘 중 하나를 시크릿에 넣을 것:"
            echo "  ANTHROPIC_API_KEY        — console.anthropic.com 에서 크레딧 충전 후 발급"
            echo "  CLAUDE_CODE_OAUTH_TOKEN  — 내 PC 에서 'claude setup-token'"
            exit 1
          fi

      - name: 롱폼·숏폼 생성
        working-directory: market-verify
        env:
          MARKET_VERIFY_LLM: ${{ steps.llm.outputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 나레이션. edge-tts 가 먼저지만 러너에서는 마이크로소프트가 막는다.
          # 그때 이 키로 넘어간다. 없으면 음성 단계에서 멈춘다.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # 매크로 토픽에만 쓰인다. 없으면 그 토픽만 건너뛰고 나머지는 돈다.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          # 이 채널 전용이다. 공용 YT_* 는 넘기지 않는다 — 대체 경로를 열어 두면
          # MV_* 를 빠뜨렸을 때 조용히 남의 자격 증명으로 올라간다.
          MV_CLIENT_ID: ${{ secrets.MV_CLIENT_ID }}
          MV_CLIENT_SECRET: ${{ secrets.MV_CLIENT_SECRET }}
          MV_REFRESH_TOKEN: ${{ secrets.MV_REFRESH_TOKEN }}
          MV_CHANNEL_ID: ${{ secrets.MV_CHANNEL_ID }}
        run: |
          python -m src.daily_pipeline \
            --outdir out \
            --source "${{ inputs.source || 'news' }}" \
            --repeat "${{ inputs.repeat || 1 }}" \
            --upload \
            --privacy "${{ inputs.privacy || 'public' }}"

      - name: 오늘 나온 것 요약
        # 로그를 열지 않아도 무엇이 몇 개 나왔는지 보이게 한다.
        # 숏폼이 0개로 끝난 회차를 한참 뒤에야 알아챈 적이 있다.
        if: always()
        working-directory: market-verify
        run: |
          long=$(ls out/*.mp4 2>/dev/null | grep -vc "_short[0-9]*\.mp4$" || true)
          short=$(ls out/*_short*.mp4 2>/dev/null | wc -l || true)
          {
            echo "## 오늘 나온 것"
            echo ""
            echo "- 롱폼 ${long:-0}개 · 숏폼 ${short:-0}개 — 발행 여부는 생성 단계 로그의 '올림' 줄"
            echo ""
            if [ "${short:-0}" -eq 0 ]; then
              echo "> 숏폼이 0개다. 대본의 \`## 숏폼 컷\` 섹션과 생성 단계 로그의 \`!\` 줄을 볼 것."
              echo ""
            fi
            echo '```'
            ls -1 out 2>/dev/null || echo "(out 폴더가 없다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과물 보관 (발행과 별개로 남겨 둔다)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneylogic-${{ github.run_number }}
          path: |
            market-verify/out/*.mp4
            market-verify/out/*.jpg
            market-verify/out/*_script.md
            market-verify/out/*_block.txt
          retention-days: 30
          if-no-files-found: warn

      - name: 다룬 소재 기록 커밋
        # 같은 소재를 다음 회차에 또 만들지 않으려면 로그가 남아야 한다.
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 첫 회차에는 파일이 새로 생긴다. add 부터 하고 스테이징된 것을 본다
          # (새 파일은 git diff 로 잡히지 않는다).
          git add market-verify/used_topics.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "기록에 바뀐 것이 없다."
            exit 0
          fi
          git commit -m "chore(market-verify): 다룬 소재 기록 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
