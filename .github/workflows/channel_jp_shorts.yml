name: 귀트는 일본어 — 쇼츠 한 편

# 하루 3편. 쇼츠는 시청 시간이 아니라 구독자를 데려오려고 낸다 —
# channel_jp/shorts.py 머리 주석을 볼 것.
#
# 되돌리려면 아래 schedule 을 지우면 된다. workflow_dispatch 는 남는다.
on:
  schedule:
    # KST = UTC+9. 롱폼(21:00 KST)과 겹치지 않게 뒀다.
    - cron: "0 23 * * *"    # 08:00 KST
    - cron: "30 3 * * *"    # 12:30 KST
    - cron: "0 10 * * *"    # 19:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "무음으로 만든다 (ElevenLabs 를 부르지 않는다)"
        required: true
        type: boolean
        default: true
      upload:
        description: "유튜브에 올린다"
        required: true
        type: boolean
        default: false
      privacy:
        description: "공개 설정"
        required: true
        type: choice
        default: public
        options: [public, unlisted, private]

permissions:
  contents: write

# 롱폼과 같은 그룹이다. 둘 다 used.json 을 고쳐 밀어 넣으므로 동시에 돌면
# 한쪽 기록이 사라질 수 있다.
concurrency:
  group: channel-jp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_VOICE_KEY: ${{ secrets.ELEVENLABS_API_KEY != '' }}
      HAS_YT_CREDS: ${{ secrets.MV_REFRESH_TOKEN != '' }}

    steps:
      # cron 으로 들어오면 inputs.* 가 전부 빈 값이다(CLAUDE.md). 여기서 한 번에
      # 정하고 아래는 이 출력만 본다.
      - name: 이번 회차 설정
        id: run
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            dry_run=false; upload=true; privacy=public
          else
            dry_run="${{ inputs.dry_run }}"; upload="${{ inputs.upload }}"; privacy="${{ inputs.privacy }}"
          fi
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "privacy=$privacy" >> "$GITHUB_OUTPUT"
          echo "::notice::dry_run=$dry_run · upload=$upload · privacy=$privacy"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 폰트와 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: 파이썬 의존성
        run: |
          pip install --quiet -r channel_jp/requirements.txt
          pip install --quiet ruff==0.6.9 pytest==8.3.3

      # 돈이 드는 단계 앞에 검사를 둔다(CLAUDE.md).
      - name: 코드 검사
        run: ruff check channel_jp/

      - name: 테스트
        working-directory: channel_jp
        run: python -m pytest -q

      - name: 키 확인
        if: ${{ steps.run.outputs.dry_run != 'true' }}
        run: |
          if [ "${HAS_VOICE_KEY}" != "true" ]; then
            echo "::error::ELEVENLABS_API_KEY 가 없다."
            exit 1
          fi

      - name: 쇼츠 만들기
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          args=""
          if [ "${{ steps.run.outputs.dry_run }}" = "true" ]; then args="--offline"; fi
          echo "BUILD_DIR=$(python3 channel_jp/shorts.py $args)" >> "$GITHUB_ENV"

      - name: 결과물 내려받기용으로 붙이기
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: |
            ${{ env.BUILD_DIR }}/video.mp4
            ${{ env.BUILD_DIR }}/metadata.json
          retention-days: 7

      - name: 유튜브에 올리기
        if: ${{ steps.run.outputs.upload == 'true' && steps.run.outputs.dry_run != 'true' }}
        env:
          # 롱폼과 같은 채널 전용 값. 공용 YT_* 는 넘기지 않는다.
          MV_CLIENT_ID: ${{ secrets.MV_CLIENT_ID }}
          MV_CLIENT_SECRET: ${{ secrets.MV_CLIENT_SECRET }}
          MV_REFRESH_TOKEN: ${{ secrets.MV_REFRESH_TOKEN }}
          MV_CHANNEL_ID: ${{ secrets.MV_CHANNEL_ID }}
        run: |
          if [ "${HAS_YT_CREDS}" != "true" ]; then
            echo "::error::MV_REFRESH_TOKEN 이 없다. 올리지 않는다."
            exit 1
          fi
          python3 channel_jp/upload.py --dir "$BUILD_DIR" --privacy "${{ steps.run.outputs.privacy }}"

      # 올린 회차에만 적는다. 안 적으면 다음 회차가 같은 문장을 또 낸다.
      - name: 쓴 문장을 기록에 남기기
        if: ${{ steps.run.outputs.upload == 'true' && steps.run.outputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_jp/data/used.json channel_jp/data/published.csv
          git diff --cached --quiet && exit 0
          git commit -m "chore: channel_jp 쇼츠 기록 갱신 [skip ci]"
          for wait in 2 4 8 16; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "::warning::기록을 밀어 넣지 못했다 — ${wait}초 뒤 다시."
            sleep "${wait}"
          done
          echo "::error::기록을 남기지 못했다. 영상은 올라갔다 — channel_jp/data/ 를 손으로 커밋할 것."
          exit 1
