name: Weekly long-form compilation (@200-y3b)

on:
  schedule:
    # Sunday 11:00 UTC = 20:00 KST — one ~8-12 min compilation per week
    - cron: "0 11 * * 0"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: "YouTube privacy status for this run"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]

env:
  DEFAULT_PRIVACY_STATUS: public

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, Korean font)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r channel_200y3b/scripts/requirements.txt

      - name: Generate this week's compilation
        id: generate
        working-directory: channel_200y3b
        run: |
          video_id=$(python3 scripts/generate_compilation.py)
          echo "video_id=$video_id" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube
        working-directory: channel_200y3b
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          privacy="${{ github.event.inputs.privacy_status || env.DEFAULT_PRIVACY_STATUS }}"
          python3 scripts/upload_video.py --video-id "${{ steps.generate.outputs.video_id }}" --privacy-status "$privacy" --log-file used_log_longform.csv

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_200y3b/used_log_longform.csv channel_200y3b/longform_volume.txt
          git diff --cached --quiet || git commit -m "Auto-publish long-form: ${{ steps.generate.outputs.video_id }}"
          git push
