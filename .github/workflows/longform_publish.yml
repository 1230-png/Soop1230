name: Weekly long-form compilation (@200-y3b)

on:
  schedule:
    # Sunday 11:00 UTC = 20:00 KST — one ~8-12 min compilation per week
    - cron: "0 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: 200y3b-longform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel_200y3b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg, Korean fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and upload this week's compilation
        env:
          # See run_shorts.yml: Y3B_* are this channel's own credentials,
          # YT_* remain only as a fallback because they are shared with
          # other channels in this repo.
          Y3B_CLIENT_ID: ${{ secrets.Y3B_CLIENT_ID }}
          Y3B_CLIENT_SECRET: ${{ secrets.Y3B_CLIENT_SECRET }}
          Y3B_REFRESH_TOKEN: ${{ secrets.Y3B_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Generated clips/audio/thumbnail go to the runner's temp
          # directory, never into the checked-out repo.
          SHORTS_OUTPUT_DIR: ${{ runner.temp }}/longform-output
        run: python scripts/generate_compilation.py

      - name: Commit updated log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_log_longform.csv longform_volume.txt
          if git diff --cached --quiet; then
            echo "No log changes to commit."
          else
            git commit -m "chore: update long-form logs [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
