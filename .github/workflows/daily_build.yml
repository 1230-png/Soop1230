name: Rush22 Daily Generation

on:
  schedule:
    # KST 07:00, 18:00 = UTC 22:00 (prev day), 09:00
    - cron: '0 22 * * *'    # 07:00 KST
    - cron: '0 9 * * *'     # 18:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel_rush22
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run auto pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python auto_pipeline.py
      
      - name: Commit updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update used_log.csv [skip ci]"
            git pull --rebase origin main
            git push
          fi
