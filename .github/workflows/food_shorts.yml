name: Food Shorts ASMR Generate

on:
  schedule:
    - cron: '0 8,10,12,14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Create output directories
        run: |
          mkdir -p food_shorts/output/generated
          mkdir -p food_shorts/output/logs
          mkdir -p food_shorts/assets/sounds

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r food_shorts/scripts/requirements.txt

      - name: Generate video
        run: |
          cd food_shorts/scripts
          python3 generate_video.py
        env:
          PYTHONUNBUFFERED: '1'
          # All three are free-of-charge registrations, and all are optional:
          # Wikimedia Commons needs no key and is always tried. More keys just
          # means a wider pool of footage and sound to draw from.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

      - name: Check generated files
        if: always()
        run: |
          echo "=== Generated Files ==="
          ls -lh food_shorts/output/generated/ 2>/dev/null || echo "No files generated"
          echo ""
          echo "=== Usage Log ==="
          tail -5 food_shorts/data/used_videos.csv 2>/dev/null || echo "No log file"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: food-shorts-output
          path: |
            food_shorts/output/generated/
            food_shorts/data/used_videos.csv
          retention-days: 30

      - name: Success notification
        if: success()
        run: |
          echo "✅ Video generation completed successfully!"
          echo "Files available in Artifacts: food-shorts-output"

      - name: Failure notification
        if: failure()
        run: |
          echo "❌ Video generation failed!"
          echo "Check logs above for details."
