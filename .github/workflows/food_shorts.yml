name: 🍳 음식 쇼츠 생성 & 업로드
on:
  schedule:
    - cron: '0 0,6,9,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - working-directory: channel_food/scripts
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - working-directory: channel_food/scripts
        run: |
          python3 generate_food_video.py > result.json
          cat result.json
      - id: parse
        working-directory: channel_food/scripts
        run: |
          VIDEO_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['video_path'])")
          METADATA_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['metadata_path'])")
          echo "video_path=${VIDEO_PATH}" >> $GITHUB_OUTPUT
          echo "metadata_path=${METADATA_PATH}" >> $GITHUB_OUTPUT
      - working-directory: channel_food/scripts
        env:
          FOOD_CLIENT_ID: ${{ secrets.FOOD_CLIENT_ID }}
          FOOD_CLIENT_SECRET: ${{ secrets.FOOD_CLIENT_SECRET }}
          FOOD_REFRESH_TOKEN: ${{ secrets.FOOD_REFRESH_TOKEN }}
        run: |
          python3 upload_food_video.py \
            --video-path "${{ steps.parse.outputs.video_path }}" \
            --metadata-path "${{ steps.parse.outputs.metadata_path }}" \
            --privacy-status public
      - run: |
          git config user.email "github-action@github.com"
          git config user.name "GitHub Action"
          git add channel_food/used_log.csv
          git diff --cached --quiet || git commit -m "📹 음식 쇼츠 자동 생성 기록"
          git push
