name: 🌘 현실 속 기괴한 현상 - 쇼츠 자동 생성 & 업로드

on:
  schedule:
    # 매일 1회, 21:00 UTC = 06:00 KST.
    # MAX_DAILY_UPLOADS=1 과 실행 횟수를 일치시켜 헛도는 빌드를 없앤다.
    - cron: '0 21 * * *'

  # 예약 실행은 public으로 올린다 (아래 업로드 단계의 || 뒤 값).
  # 다시 비공개로 돌리려면 그 값을 'private'으로 바꾸면 된다.
  # 여기 한 곳만 고치면 되고, 수동 실행은 그대로 선택할 수 있다.
  workflow_dispatch:
    inputs:
      privacy_status:
        description: '공개 범위 (처음에는 private로 시험해 볼 것)'
        type: choice
        default: 'private'
        options: [private, unlisted, public]
      audio_mode:
        description: '오디오 방식'
        type: choice
        default: 'narration'
        options: [narration, narration_ambience]
      skip_daily_guard:
        description: '일일 1편 제한 무시 (수동 시험용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 행이 걸린 잡이 무료 실행 시간을 태우지 않도록 상한을 둔다.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg & 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 의존성 설치
        working-directory: channel_food/scripts
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 지표 수집
        # 어제까지 올린 영상의 조회수·좋아요를 받아 metrics.csv에 쌓는다.
        # 실적이 나쁜 주제는 아래 생성 단계가 이 파일을 보고 건너뛴다.
        # videos.list는 1회 1 unit이라 업로드 할당량에 사실상 영향이 없고,
        # 실패해도 exit 0이다 — 지표가 없다고 발행이 멈추면 안 된다.
        working-directory: channel_food/scripts
        env:
          WEIRD_CLIENT_ID: ${{ secrets.WEIRD_CLIENT_ID }}
          WEIRD_CLIENT_SECRET: ${{ secrets.WEIRD_CLIENT_SECRET }}
          WEIRD_REFRESH_TOKEN: ${{ secrets.WEIRD_REFRESH_TOKEN }}
        run: python3 collect_metrics.py

      - name: 현재 판정 상태
        working-directory: channel_food/scripts
        run: python3 feedback.py

      - name: 영상 생성
        id: generate
        working-directory: channel_food/scripts
        env:
          AUDIO_MODE: ${{ inputs.audio_mode || 'narration' }}
          # 없으면 그라데이션 배경으로 되돌아가므로 필수는 아니다.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # 예약 실행에는 inputs가 없으므로 항상 빈 값 → 가드가 정상 작동한다.
          SKIP_DAILY_GUARD: ${{ inputs.skip_daily_guard && '1' || '' }}
        run: |
          python3 generate_weird_video.py > result.json
          cat result.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("result.json"))
          print(f"skipped={str(r.get('skipped', False)).lower()}")
          print(f"video_path={r.get('video_path', '')}")
          print(f"metadata_path={r.get('metadata_path', '')}")
          PY

      - name: 일일 한도 도달 안내
        if: steps.generate.outputs.skipped == 'true'
        run: echo "오늘 몫은 이미 처리했습니다. 업로드를 건너뜁니다."

      - name: 유튜브 업로드
        if: steps.generate.outputs.skipped == 'false'
        working-directory: channel_food/scripts
        env:
          WEIRD_CLIENT_ID: ${{ secrets.WEIRD_CLIENT_ID }}
          WEIRD_CLIENT_SECRET: ${{ secrets.WEIRD_CLIENT_SECRET }}
          WEIRD_REFRESH_TOKEN: ${{ secrets.WEIRD_REFRESH_TOKEN }}
          # 생성 단계와 같은 값. 예약 실행에서는 항상 빈 값이다.
          SKIP_DAILY_GUARD: ${{ inputs.skip_daily_guard && '1' || '' }}
        run: |
          python3 upload_weird_video.py \
            --video-path "${{ steps.generate.outputs.video_path }}" \
            --metadata-path "${{ steps.generate.outputs.metadata_path }}" \
            --privacy-status "${{ inputs.privacy_status || 'public' }}"

      - name: 기록 커밋
        # 생성이 건너뛰어졌어도 지표는 커밋한다. 그래야 발행이 없는 날에도
        # 조회수가 계속 쌓여 피드백 판정이 앞으로 나아간다.
        if: always()
        run: |
          git config user.email "github-action@github.com"
          git config user.name "GitHub Action"
          git add channel_food/used_log.csv channel_food/metrics.csv
          git diff --cached --quiet || git commit -m "🌘 쇼츠 발행 기록 및 지표"
          # 같은 시각에 다른 잡이 밀어 넣었을 수 있다. 한 번 당겨서 다시 시도한다.
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
