name: 🍳 음식 쇼츠 자동 생성 & 업로드

on:
  schedule:
    # 매일 09:00, 15:00, 21:00 (KST 기준으로 수정 필요)
    # UTC로는 00:00, 06:00, 12:00
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: ffmpeg & 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 의존성 설치
        working-directory: channel_food/scripts
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 영상 생성
        working-directory: channel_food/scripts
        run: |
          python3 generate_food_video.py > result.json 2>&1
          cat result.json

      - name: 결과 파싱
        id: parse
        working-directory: channel_food/scripts
        run: |
          VIDEO_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['video_path'])")
          METADATA_PATH=$(python3 -c "import json; r=json.load(open('result.json')); print(r['metadata_path'])")
          echo "video_path=${VIDEO_PATH}" >> $GITHUB_OUTPUT
          echo "metadata_path=${METADATA_PATH}" >> $GITHUB_OUTPUT

      - name: 유튜브 업로드 (쿠팡 링크 자동 삽입)
        working-directory: channel_food/scripts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 upload_food_video.py \
            --video-path "${{ steps.parse.outputs.video_path }}" \
            --metadata-path "${{ steps.parse.outputs.metadata_path }}" \
            --privacy-status public

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.email "github-action@github.com"
          git config user.name "GitHub Action"
          git add channel_food/used_log.csv
          git diff --cached --quiet || git commit -m "📹 음식 쇼츠 자동 생성 기록"
          git push
