name: 채널 상태 (channel_health)

# 필수조건 6번을 받치는 계측이다. 그동안 이 저장소에는 어떤 영상이 어떻게
# 됐는지 아는 코드가 없었고, 그래서 개선이 전부 추측이었다.
#
# **올리는 것이 없다.** 유튜브를 읽기만 한다. 업로드·수정·댓글 호출이 하나도
# 없어서 이 워크플로가 채널을 바꾸는 일은 없다. cron 을 바로 걸어 둔 근거가
# 그것이니, 여기에 쓰기 단계를 더하려면 그 전제부터 다시 볼 것.
#
# 일요일 아침에 한 번. 매일 돌 이유가 없다 — 조회수는 하루로는 안 움직이고,
# 자주 보낸 보고서는 안 읽힌다.

on:
  schedule:
    # 토 22:00 UTC = 일 07:00 KST. 무료 러너가 두 시간쯤 늦게 뜬다.
    - cron: "0 22 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: channel-health
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel_health
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 파이썬 패키지
        run: pip install -r requirements.txt

      - name: 코드 검사
        run: |
          pip install "ruff==0.6.9"
          ruff check .
          python -m pytest -q

      - name: 지표 수집 (읽기 전용)
        env:
          Y3B_CLIENT_ID: ${{ secrets.Y3B_CLIENT_ID }}
          Y3B_CLIENT_SECRET: ${{ secrets.Y3B_CLIENT_SECRET }}
          Y3B_REFRESH_TOKEN: ${{ secrets.Y3B_REFRESH_TOKEN }}
        run: python -m collect

      - name: 보고서
        run: |
          python -m report --out report.md
          # 실행 페이지에 그대로 띄운다. 받아 봐야 읽히는 보고서는 안 읽힌다.
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 보고서 보관
        uses: actions/upload-artifact@v4
        with:
          name: channel-health-${{ github.run_number }}
          path: channel_health/report.md
          retention-days: 90
          if-no-files-found: warn

      - name: 기록 커밋
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 구독자 수는 metrics.csv 가 아니라 channel_stats.csv 에 쌓인다.
          # 여기 빠뜨리면 수익화 거리가 매주 "기록 없음"으로 나온다.
          #
          # 있는 것만 넣는다. `git add` 는 없는 경로를 받으면 실패하는데,
          # 그러면 이 단계가 통째로 죽어서 지표 스냅샷까지 같이 잃는다.
          # `git add -A channel_health/` 로 뭉뚱그리지 않는 이유는, 그러면
          # 나중에 이 잡이 코드를 건드리게 됐을 때 그것까지 조용히 커밋되기
          # 때문이다. 기록 파일만 이름으로 넣는다.
          for record in channel_health/metrics.csv channel_health/channel_stats.csv; do
            [ -f "$record" ] && git add "$record"
          done
          if git diff --cached --quiet; then
            echo "기록에 바뀐 것이 없다."
            exit 0
          fi
          git commit -m "chore(channel_health): 채널 지표·구독자 스냅샷 [skip ci]"
          # 같은 브랜치에 발행 워크플로들(run_shorts·longform)도 기록을 밀어
          # 넣는다. 워크플로마다 concurrency 그룹이 달라 겹쳐 돌 수 있고, 무료
          # 러너가 늦게 뜨는 날은 간격이 더 좁아진다. 그냥 push 하면
          # non-fast-forward 로 튕겨 이번 스냅샷만 잃는다. 파일이 서로 달라
          # rebase 는 충돌 없이 얹힌다.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          # 여기서 멈춰도 발행에는 영향이 없다. 잃는 것은 이번 주 스냅샷 하나이고,
          # 그러면 다음 주 "직전 기록 이후" 구간이 2주로 벌어진다.
          echo "::error::지표 스냅샷을 push 하지 못했다. 이번 주 기록이 빠진다."
          exit 1
