# E01 「세그폴트는 왜 나는가」
#
# 1편을 세그폴트로 여는 이유: 모든 개발자가 이미 본 메시지다. 겪어 본 사건의
# 원인을 설명하는 것이 가장 강한 훅이고, 구독자 0명 채널은 검색으로만
# 유입되는데 "Segmentation fault" 는 사람들이 실제로 그대로 복사해 치는 말이다.
#
# 대본을 저장소에 적어 두는 이유: 발행 파이프라인 안에 LLM 호출을 두지 않기로
# 했다. 실행 시점에 모델을 부르면 503 한 번이 발행 실패이고, 무엇보다 내용이
# 매번 조금씩 달라져 틀린 설명이 사람 검수 없이 나간다.

id: E01
season: S1
title: "세그폴트는 왜 나는가"
hook: "프로세스 메모리 구조"
target_minutes: 18

# 검색으로 들어오는 사람이 실제로 치는 말을 앞에 둔다.
tags:
  - 세그멘테이션폴트
  - segmentation fault
  - C언어
  - 포인터
  - 메모리
  - 운영체제
  - CS기초
  - 개발자면접

summary: |
  Segmentation fault 는 "포인터를 잘못 썼다"는 뜻이 아닙니다. 그 한 줄이
  나오기까지 CPU 의 주소 변환, 커널의 페이지 폴트 처리, 시그널 전달이
  차례로 일어납니다. 그 경로를 따라가면 왜 어떤 잘못은 즉시 죽고 어떤
  잘못은 한참 뒤에야 엉뚱한 곳에서 터지는지가 설명됩니다.

takeaway: |
  이 영상을 보고 나면 세그폴트를 만났을 때 추측 대신 순서를 밟게 됩니다 —
  코어 덤프에서 주소를 확인하고, 그 주소가 매핑된 영역인지 보고,
  쓰기였는지 읽기였는지로 원인을 좁히는 순서입니다.

scenes:
  - card: {kind: title}
    chapter: "여는 말"
    say: |
      C나 C++로 프로그램을 짜 본 사람이라면 이 메시지를 반드시 한 번은 봤습니다.
      Segmentation fault. 코어 덤프. 그리고 프로그램은 아무 설명 없이 사라집니다.
      대부분은 여기서 포인터를 어디선가 잘못 썼구나, 하고 코드를 뒤지기 시작합니다.
      그 추측은 보통 맞습니다. 하지만 추측이 맞는 것과 원인을 아는 것은 다릅니다.
      오늘은 그 한 줄이 화면에 찍히기까지 컴퓨터 안에서 실제로 무슨 일이
      일어났는지를, 하드웨어부터 커널까지 순서대로 따라가 보겠습니다.

  - card:
      kind: terminal
      chip: "우리가 보는 것"
      command: "./a.out"
      output: |
        Segmentation fault (core dumped)
        $ echo $?
        139
      caption: "종료 코드 139는 128 더하기 11, 즉 11번 시그널로 죽었다는 뜻입니다"
    say: |
      먼저 이 메시지가 누구의 말인지부터 봅시다. 이건 여러분의 프로그램이 찍은 게
      아닙니다. 프로그램은 이미 죽었습니다. 이 줄을 화면에 쓴 건 셸입니다.
      셸은 자식 프로세스가 어떻게 끝났는지 확인하고, 시그널에 맞아 죽었으면
      그 시그널의 이름을 대신 찍어 줍니다.
      종료 코드를 보면 백삼십구입니다. 백이십팔 더하기 십일이죠.
      십일번 시그널, 그러니까 SIGSEGV 입니다.
      여기서 이미 첫 번째 사실이 나옵니다. 여러분의 프로그램은 스스로 종료한 게
      아니라 커널에게 죽임을 당했습니다. 그렇다면 커널은 왜 죽였을까요.

  - card:
      kind: diagram
      chip: "프로세스 메모리"
      shape: stack
      rows:
        - {label: "스택", note: "지역 변수 · 함수 프레임", accent: true}
        - {label: "(비어 있음)", note: "가드 · 미매핑 구간"}
        - {label: "힙", note: "malloc 이 떼어 주는 곳"}
        - {label: "데이터", note: "전역 변수"}
        - {label: "텍스트", note: "기계어 · 읽기 전용"}
      caption: "위가 높은 주소입니다. 스택은 아래로, 힙은 위로 자랍니다"
    say: |
      프로세스 하나가 보는 메모리는 이렇게 생겼습니다.
      맨 아래 텍스트 영역에 기계어가 올라가 있고, 그 위에 전역 변수가 사는
      데이터 영역이 있습니다. 그 위가 힙입니다. malloc 이 떼어 주는 곳이죠.
      맨 위가 스택입니다. 지역 변수와 함수 호출 기록이 여기에 쌓입니다.
      중요한 건 가운데의 넓은 빈 구간입니다. 주소로는 존재하지만
      아무것도 배정되지 않은 구간이에요.
      세그폴트의 거의 전부가 이 빈 구간, 또는 권한이 맞지 않는 구간을
      건드렸을 때 일어납니다.

  - card:
      kind: talk
      chip: "핵심"
      heading: "이 주소들은 진짜 주소가 아닙니다"
      points:
        - "프로세스가 보는 주소는 전부 가상 주소"
        - "실제 램의 번지수와는 다른 번호 체계"
        - "변환은 CPU 안의 MMU 가 담당"
        - "변환표가 곧 페이지 테이블"
    say: |
      여기서 많은 분이 놓치는 지점이 있습니다.
      방금 그림에 나온 주소들은 실제 램의 번지수가 아닙니다. 전부 가상 주소입니다.
      프로세스마다 자기만의 번호 체계를 가지고 있어서,
      두 프로그램이 똑같이 0x400000 번지를 써도 서로 다른 물리 메모리를 씁니다.
      가상 주소를 물리 주소로 바꾸는 일은 CPU 안의 MMU, 메모리 관리 장치가
      합니다. 그 변환에 쓰는 표가 페이지 테이블이고요.
      이 구조 덕분에 프로그램끼리 서로의 메모리를 덮어쓰지 못합니다.
      그리고 바로 이 구조가 세그폴트를 만들어 냅니다.

  - card:
      kind: diagram
      chip: "주소 변환"
      shape: flow
      rows:
        - {label: "가상 주소"}
        - {label: "페이지 테이블"}
        - {label: "물리 주소"}
        - {label: "없으면 폴트", accent: true}
      caption: "표에 항목이 없거나 권한이 맞지 않으면 CPU가 커널을 부릅니다"
    say: |
      접근이 일어날 때마다 이 경로를 지납니다.
      프로그램이 어떤 주소를 읽거나 쓰려고 하면, MMU 가 페이지 테이블을 찾아보고
      대응하는 물리 주소를 꺼냅니다. 찾았으면 그대로 진행합니다.
      문제는 못 찾았을 때입니다. 그 주소에 해당하는 항목이 아예 없거나,
      있더라도 권한이 맞지 않으면 — 읽기 전용인데 쓰려고 했다든가 —
      CPU 는 실행을 멈추고 커널로 제어를 넘깁니다. 이것을 페이지 폴트라고 합니다.
      여기서 오해가 하나 풀립니다. 페이지 폴트 자체는 오류가 아닙니다.
      아주 흔한 정상 동작이에요.

  - card:
      kind: talk
      chip: "중요"
      heading: "페이지 폴트는 대부분 정상입니다"
      points:
        - "스택을 처음 건드릴 때: 커널이 물리 페이지를 붙여 줍니다"
        - "파일을 mmap 했을 때: 그때 디스크에서 읽어 옵니다"
        - "fork 직후 쓰기: 그 순간 페이지를 복사합니다"
        - "해결할 수 없을 때만 SIGSEGV 가 됩니다"
    say: |
      커널이 페이지 폴트를 받으면 먼저 이렇게 묻습니다.
      이 주소가 이 프로세스에게 원래 허락된 곳인가.
      스택이 조금 더 필요해서 새 영역을 건드린 거라면 허락된 것입니다.
      커널은 물리 페이지를 하나 붙여 주고 아무 일 없었다는 듯 프로그램을
      이어서 돌립니다. 파일을 메모리에 매핑해 두고 처음 읽는 경우도 마찬가지고요.
      그 순간에 디스크에서 읽어 옵니다. fork 로 만든 자식이 처음 쓰기를 할 때도
      여기서 페이지를 복사합니다.
      이 세 가지가 전부 페이지 폴트로 처리됩니다.
      커널이 손쓸 수 없을 때, 그러니까 애초에 허락되지 않은 주소일 때만
      SIGSEGV 가 프로세스에게 날아갑니다.

  - card:
      kind: code
      chip: "사례 1"
      lang: c
      code: |
        #include <stdio.h>

        int main(void)
        {
            int *p = NULL;
            printf("%d\n", *p);
            return 0;
        }
      highlight: [6]
      caption: "가장 흔한 세그폴트 — NULL 포인터 역참조"
    say: |
      첫 번째 사례입니다. 가장 흔한 형태죠.
      포인터에 NULL 을 넣고 그대로 역참조했습니다.
      NULL 은 거의 모든 환경에서 주소 0 번입니다.
      그러면 이 프로그램은 0 번지를 읽으려고 시도하고,
      MMU 는 페이지 테이블에서 0 번지를 찾다가 아무것도 없다는 걸 확인하고,
      커널이 불려 오고, 커널은 이 프로세스에게 0 번지를 준 적이 없다고 판단하고,
      SIGSEGV 를 보냅니다. 여섯 줄짜리 프로그램에서 방금 말한 일이 전부 일어납니다.

  - card:
      kind: terminal
      chip: "사례 1"
      command: "cat /proc/sys/vm/mmap_min_addr"
      output: |
        65536
      caption: "리눅스는 낮은 주소 64KB를 아예 매핑 못 하게 막아 둡니다"
    say: |
      그런데 왜 하필 0 번지 근처는 항상 비어 있을까요. 우연이 아닙니다.
      리눅스에는 mmap_min_addr 라는 설정이 있습니다. 보통 육만오천오백삼십육,
      그러니까 64 킬로바이트로 잡혀 있어요.
      이 아래 주소는 일반 프로그램이 매핑하는 것 자체가 금지됩니다.
      왜 막아 두느냐면, 커널에 NULL 포인터 버그가 있을 때
      공격자가 미리 0 번지에 자기 코드를 깔아 두는 공격이 실제로 있었기 때문입니다.
      덕분에 우리는 부수 효과를 하나 얻었습니다.
      NULL 역참조가 조용히 넘어가지 않고 반드시 죽는다는 것이죠.
      이건 좋은 일입니다. 조용한 버그보다 시끄러운 죽음이 낫습니다.

  - card:
      kind: code
      chip: "사례 2"
      lang: c
      code: |
        int main(void)
        {
            int a[4];
            a[5] = 1;      /* survives */
            a[100000] = 1; /* SIGSEGV  */
            return 0;
        }
      highlight: [4, 5]
      caption: "같은 범위 초과인데 결과가 다릅니다 — 왜일까요"
    say: |
      두 번째 사례입니다. 이게 사람을 제일 헷갈리게 만드는 경우예요.
      크기가 4 인 배열에 5 번 인덱스로 씁니다. 명백한 범위 초과입니다.
      그런데 이 프로그램은 대개 죽지 않습니다.
      바로 아래 줄, 십만 번 인덱스로 쓰면 그때는 죽습니다.
      둘 다 똑같이 배열 밖인데 왜 하나만 죽을까요.
      여기서 아주 중요한 사실이 나옵니다.
      세그폴트는 배열 범위를 검사해서 나는 게 아닙니다.
      C 는 배열 범위를 아예 모릅니다. 검사하는 건 페이지 단위의 매핑뿐입니다.

  - card:
      kind: diagram
      chip: "왜 다른가"
      shape: compare
      rows:
        - {left: "a[5]", right: "a[100000]"}
        - {left: "같은 스택 페이지 안", right: "매핑 범위를 한참 벗어남"}
        - {left: "이미 매핑돼 있음", right: "페이지 테이블에 없음"}
        - {left: "조용히 성공", right: "즉시 SIGSEGV"}
        - {left: "옆 변수를 덮어씀", right: "원인 지점에서 죽음"}
      caption: "조용히 성공하는 쪽이 훨씬 위험합니다"
    say: |
      차이는 이겁니다.
      a 5 번은 배열 밖이지만 여전히 같은 스택 페이지 안입니다.
      그 페이지는 이미 매핑돼 있으니 MMU 입장에서는 아무 문제가 없습니다.
      쓰기는 성공합니다. 대신 바로 옆에 있던 다른 지역 변수를 덮어씁니다.
      a 십만 번은 페이지 몇 개를 훌쩍 넘어가서 매핑되지 않은 구간에 닿습니다.
      그래서 즉시 죽습니다.
      여기서 직관과 반대되는 결론이 나옵니다.
      죽는 쪽이 운이 좋은 겁니다.
      죽지 않는 쪽은 버그를 안고 계속 돌다가,
      한참 뒤 전혀 상관없는 곳에서 이상한 값으로 터집니다.
      그리고 그때는 원인을 찾기가 훨씬 어렵습니다.

  - card:
      kind: code
      chip: "사례 3"
      lang: c
      code: |
        int main(void)
        {
            char *s = "hello";
            s[0] = 'H';    /* SIGSEGV */
            return 0;
        }
      highlight: [4]
      caption: "문자열 리터럴은 읽기 전용 영역에 놓입니다"
    say: |
      세 번째 사례입니다. 이번에는 주소가 매핑돼 있는데도 죽습니다.
      문자열 리터럴을 포인터로 받아서 첫 글자를 바꾸려고 했습니다.
      s 가 가리키는 주소는 분명히 존재하고 매핑도 돼 있습니다.
      읽는 건 아무 문제 없어요. 그런데 쓰려고 하면 죽습니다.
      문자열 리터럴은 실행 파일 안의 점 rodata 영역에 들어가고,
      이 영역은 읽기 전용으로 매핑되기 때문입니다.
      페이지 테이블 항목에는 주소뿐 아니라 권한 비트가 같이 들어 있습니다.
      쓰기 금지 비트가 서 있는 페이지에 쓰기를 시도하면
      그것도 페이지 폴트이고, 커널이 해결할 수 없는 폴트라 SIGSEGV 가 됩니다.

  - card:
      kind: terminal
      chip: "직접 보기"
      command: "cat /proc/self/maps | head -4"
      output: |
        55d1c4a00000-55d1c4a01000 r--p  /usr/bin/cat
        55d1c4a01000-55d1c4a05000 r-xp  /usr/bin/cat
        55d1c4a05000-55d1c4a07000 r--p  /usr/bin/cat
        55d1c4a08000-55d1c4a09000 rw-p  /usr/bin/cat
      caption: "r 읽기 w 쓰기 x 실행 — 권한이 영역마다 다릅니다"
    say: |
      말로만 들으면 와닿지 않으니 직접 봅시다.
      proc 자기 자신 maps 를 열면 지금 이 프로세스가 가진 메모리 영역이
      전부 나옵니다.
      주소 범위 옆에 붙은 네 글자가 권한입니다.
      r 은 읽기, w 는 쓰기, x 는 실행이고 없으면 하이픈으로 표시됩니다.
      두 번째 줄을 보세요. r-x 입니다. 읽고 실행할 수는 있지만 쓸 수는 없어요.
      기계어가 올라가 있는 텍스트 영역입니다.
      첫 줄은 r 만 있죠. 읽기 전용 데이터, 아까 말한 문자열 리터럴이 사는 곳입니다.
      이 표에 없는 주소를 건드리거나, 있어도 권한에 맞지 않게 건드리면
      그게 세그폴트입니다. 딱 두 가지 경우뿐입니다.

  - card:
      kind: talk
      chip: "정리"
      heading: "세그폴트가 나는 경우는 둘뿐입니다"
      points:
        - "매핑되지 않은 주소를 건드렸다"
        - "매핑됐지만 권한이 맞지 않았다"
        - "그 밖의 모든 잘못은 조용히 넘어갑니다"
    say: |
      여기까지를 한 문장으로 줄이면 이렇습니다.
      세그폴트는 매핑되지 않은 주소를 건드렸거나,
      매핑은 됐지만 권한이 맞지 않았을 때 납니다. 이 둘뿐입니다.
      반대로 말하면, 그 밖의 잘못은 전부 조용히 넘어간다는 뜻이기도 합니다.
      해제된 메모리를 다시 쓰는 것도, 남의 지역 변수를 덮어쓰는 것도
      페이지 단위로는 멀쩡한 주소라 아무 일도 일어나지 않습니다.
      그래서 세그폴트가 안 난다는 것이 메모리를 올바르게 썼다는 증거가
      전혀 되지 못합니다.

  - card:
      kind: terminal
      chip: "잡는 법 1"
      command: "ulimit -c unlimited && ./a.out && coredumpctl gdb"
      output: |
        Program terminated with signal SIGSEGV.
        #0  0x0000555555555151 in main () at bug.c:6
        6           printf("%d\n", *p);
      caption: "코어 덤프는 죽는 순간의 메모리를 통째로 남긴 파일입니다"
    say: |
      그럼 실제로 만났을 때 어떻게 잡을까요.
      추측으로 코드를 뒤지기 전에 순서를 밟는 편이 훨씬 빠릅니다.
      첫 번째는 코어 덤프입니다.
      아까 메시지에 코어 덤프라고 쓰여 있었죠. 죽는 순간의 메모리 상태를
      통째로 파일로 남긴 겁니다.
      다만 기본 설정에서는 크기 제한이 0 이라 실제로는 안 남는 경우가 많습니다.
      ulimit 으로 제한을 풀고 다시 돌린 다음, gdb 로 그 덤프를 열면
      어느 줄에서 죽었는지가 바로 나옵니다.
      최적화를 끄고 디버그 정보를 넣어 컴파일해 두면 줄 번호까지 정확히 보입니다.

  - card:
      kind: code
      chip: "잡는 법 2"
      lang: text
      code: |
        gcc -g -O0 -fsanitize=address bug.c
      caption: "AddressSanitizer — 죽지 않는 잘못까지 잡아 줍니다"
    say: |
      두 번째가 더 중요합니다. AddressSanitizer 입니다.
      컴파일할 때 이 옵션 하나만 붙이면 됩니다.
      아까 a 5 번 기억하시죠. 세그폴트가 안 나던 그 경우요.
      ASan 은 그것도 잡습니다.
      원리는 간단합니다. 할당된 메모리 주변에 접근 금지 구역을 만들어 두고,
      모든 메모리 접근 앞에 검사 코드를 끼워 넣습니다.
      페이지 단위가 아니라 바이트 단위로 보기 때문에
      MMU 가 놓치는 잘못까지 보입니다.

  - card:
      kind: terminal
      chip: "잡는 법 2"
      command: "./a.out"
      output: |
        ERROR: AddressSanitizer: stack-buffer-overflow
        WRITE of size 4 at 0x7ffd9c3a1234 thread T0
            #0 0x5555555551a9 in main bug.c:4
        Address is located in stack of thread T0 at offset 36
      caption: "어디서, 무엇을, 몇 바이트나 넘겼는지까지 나옵니다"
    say: |
      출력을 보면 차이가 확연합니다.
      그냥 Segmentation fault 한 줄이 아니라,
      스택 버퍼 오버플로가 났고, 4 바이트 쓰기였고, bug 점 c 의 4 번째 줄이고,
      스택에서 36 바이트 지점이라고 알려 줍니다.
      대신 대가가 있습니다. 실행 속도가 두 배쯤 느려지고 메모리를 세 배쯤 씁니다.
      그래서 운영 환경이 아니라 개발과 테스트에서 켭니다.
      CI 에서 테스트를 돌릴 때 이 옵션을 켜 두는 것만으로
      나중에 새벽에 터질 버그를 상당수 미리 잡을 수 있습니다.

  - card:
      kind: talk
      chip: "실무"
      heading: "세그폴트를 만났을 때의 순서"
      points:
        - "1. 코어 덤프에서 죽은 주소를 확인한다"
        - "2. 그 주소가 0 근처인가 — 그러면 NULL 계열"
        - "3. 읽기였나 쓰기였나 — 쓰기면 권한이나 범위"
        - "4. 재현되면 ASan 을 켜고 다시 돌린다"
    say: |
      실무에서 쓸 순서로 정리하겠습니다.
      첫째, 코어 덤프를 열어 죽은 주소를 확인합니다.
      둘째, 그 주소가 0 근처인지 봅니다. 0 이나 아주 작은 값이면
      NULL 이거나 NULL 에서 몇 바이트 떨어진 필드에 접근한 경우입니다.
      구조체 포인터가 NULL 인데 멤버를 읽으면 주소가 0 이 아니라
      0 더하기 오프셋으로 찍히거든요. 이걸 알면 바로 좁혀집니다.
      셋째, 읽기였는지 쓰기였는지 확인합니다. 쓰기였다면
      읽기 전용 영역이거나 범위를 넘긴 경우로 좁혀집니다.
      넷째, 재현이 되면 ASan 을 켜고 다시 돌립니다.
      이 네 단계면 대부분의 세그폴트는 십 분 안에 원인이 나옵니다.

  - card:
      kind: talk
      chip: "왜 이 이름인가"
      heading: "세그먼트는 이제 거의 안 쓰는데요"
      points:
        - "옛 x86 은 메모리를 세그먼트로 나눠 보호했습니다"
        - "지금은 페이징이 그 일을 합니다"
        - "이름만 남고 구조는 바뀐 셈입니다"
    say: |
      마지막으로 이름 이야기를 하겠습니다.
      왜 페이지 폴트인데 세그멘테이션 폴트라고 부를까요.
      옛날 x86 은 메모리를 세그먼트라는 단위로 나누고
      세그먼트마다 한계와 권한을 걸어 보호했습니다.
      그 한계를 넘으면 세그멘테이션 위반이었죠. 이름은 거기서 왔습니다.
      지금은 64비트 모드에서 세그먼테이션이 사실상 쓰이지 않고
      페이징이 그 일을 전부 합니다.
      그러니까 이 이름은 구조가 바뀐 뒤에도 남은 화석 같은 겁니다.
      이런 게 생각보다 많습니다.
      이름만 보고 구조를 짐작하면 틀리는 이유이기도 하고요.

  - card:
      kind: talk
      chip: "다음 편"
      heading: "스택이 힙보다 빠른 이유"
      points:
        - "오늘 본 스택과 힙, 왜 속도가 다를까"
        - "malloc 이 실제로 하는 일"
        - "지역 변수가 공짜에 가까운 이유"
    say: |
      오늘 내용을 한 번 더 줄이면 이렇습니다.
      세그폴트는 포인터 오류의 이름이 아니라,
      주소 변환에 실패했다는 하드웨어 사건의 이름입니다.
      그래서 포인터를 잘못 썼는데도 조용한 경우가 있고,
      포인터가 멀쩡한데 권한 때문에 죽는 경우도 있습니다.
      다음 편에서는 오늘 그림에 나왔던 스택과 힙을 다시 꺼내겠습니다.
      둘 다 같은 램인데 왜 스택이 훨씬 빠른지,
      malloc 이 그 안에서 실제로 무슨 일을 하는지를 보겠습니다.
      도움이 되셨다면 구독해 두시면 다음 편에 이어서 보실 수 있습니다.
      다음 시간에 뵙겠습니다.
