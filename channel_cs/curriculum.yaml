# 「다시 배우는 CS」 커리큘럼.
#
# 왜 롱폼인가: 유효 공개 시청 시간에 숏폼은 집계되지 않는다. 앞선 채널이
# 61일 동안 숏츠로 13,848회를 모으고도 시청 시간은 거의 0이었다. 같은 조건을
# 30분 영상 지속률 40%로 바꾸면 1회당 12분이 쌓여, 3,000시간까지 필요한
# 조회수가 300만에서 1.5만으로 내려간다. 형식이 주제보다 먼저다.
#
# 왜 CS 기초인가: 시의성이 없어 무인 발행과 상성이 맞다. 최신 기술 소식은
# 사람 검수 없이는 틀린 정보가 그대로 발행되지만, 페이지 테이블이 어떻게
# 도는지는 작년에도 올해도 같다. 그리고 길고 체계적이라 시리즈로 묶인다 —
# 연속 시청이 붙는 것이 시청 시간의 전부다.
#
# 순서 원칙: 실무 체감이 큰 것부터. 1편이 재미없으면 2편은 없다. 메모리를
# 먼저 두는 이유는 세그폴트·OOM·GC 멈춤이 모든 개발자가 이미 겪어 본
# 사건이기 때문이다. 겪어 본 사건의 원인을 설명하는 것이 가장 강한 훅이다.

channel:
  name: 다시 배우는 CS
  handle: "@다시배우는CS"
  # 설명란은 나열형을 금지한다. 앞 채널의 "최신 기술 트렌드 / AI / 인사이트 /
  # 노하우 / 생태계"가 정확히 그것이었고, 무엇을 보게 되는지 한 줄도 알려주지
  # 못했다. 여기서는 시청자가 무엇을 가져가는지만 적는다.
  description: |
    학교에서 배웠지만 실무에서 왜 중요한지 몰랐던 CS를 다시 봅니다.

    세그폴트는 왜 나는지, OOM Killer는 무엇을 보고 프로세스를 고르는지,
    배열이 연결 리스트보다 빠른 진짜 이유가 무엇인지.
    이미 겪어 본 사건에서 출발해 그 아래에서 실제로 일어난 일까지 내려갑니다.

    코드와 터미널 출력을 화면에 띄우고, 메모리와 패킷이 어떻게 움직이는지
    그림으로 확인합니다. 외우는 채널이 아니라 납득하는 채널입니다.

    시즌 1 메모리 · 시즌 2 프로세스와 동시성 · 시즌 3 입출력과 네트워크
    시즌 4 자료구조의 실제 비용

  # 채널 키워드. 실제로 사람이 치는 말로 넣는다.
  keywords:
    - CS 기초
    - 운영체제
    - 컴퓨터구조
    - 네트워크
    - 자료구조
    - 개발자 면접
    - 백엔드
    - 시스템 프로그래밍
    - 메모리 관리
    - 성능 최적화

# 주 2편. 구독자 0명에서 시작하므로 편수보다 한 편의 완성도가 먼저다.
# 늘리는 것은 데이터를 보고 정한다.
schedule:
  per_week: 2
  # 화·금 21:00 KST. 퇴근 후 긴 영상을 트는 시간대.
  days: [tue, fri]
  hour_kst: 21

seasons:
  - id: S1
    name: 메모리
    why: |
      모든 개발자가 세그폴트·OOM·GC 멈춤을 이미 겪었다. 겪어 본 사건에서
      출발하면 "그래서 그때 그게 이거였구나"가 되고, 그 순간이 끝까지 보게
      만든다.
  - id: S2
    name: 프로세스와 동시성
    why: |
      CPU 사용률이 100%인데 느린 상황, 값이 깨지는 상황은 원인을 모르면
      손댈 수가 없다. 여기가 가장 자주 잘못 배운 영역이기도 하다.
  - id: S3
    name: 입출력과 네트워크
    why: |
      대부분의 서비스는 계산이 아니라 기다림에서 시간을 쓴다. 그런데 기다림의
      구조는 학교에서 제일 대충 배우고 지나간다.
  - id: S4
    name: 자료구조의 실제 비용
    why: |
      빅오는 외웠지만 왜 실무 정렬이 퀵소트가 아닌지, 왜 DB 인덱스가
      B-트리인지는 설명하지 못한다. 이론과 실제가 갈라지는 지점을 다룬다.

# 한 줄이 영상 한 편이다. hook 은 썸네일과 첫 30초에 들어간다.
# 제목이 문장 중간에서 잘리지 않도록 32자 이내로 맞췄다 — 앞 채널의
# "…길목마다", "…커널 내부 소켓" 같은 잘림이 "AI스럽다"의 실제 원인이었다.
episodes:
  - {id: E01, season: S1, title: "세그폴트는 왜 나는가", hook: "프로세스 메모리 구조"}
  - {id: E02, season: S1, title: "스택이 힙보다 빠른 이유", hook: "스택과 힙"}
  - {id: E03, season: S1, title: "OOM Killer는 누구를 죽이나", hook: "가상 메모리와 페이지"}
  - {id: E04, season: S1, title: "배열이 연결 리스트를 이기는 이유", hook: "캐시 지역성"}
  - {id: E05, season: S1, title: "GC는 왜 멈추는가", hook: "가비지 컬렉션"}

  - {id: E06, season: S2, title: "스레드는 공짜가 아니다", hook: "컨텍스트 스위칭"}
  - {id: E07, season: S2, title: "CPU 100%인데 왜 느린가", hook: "스케줄러"}
  - {id: E08, season: S2, title: "데드락이 만들어지는 네 조건", hook: "락과 동기화"}
  - {id: E09, season: S2, title: "멀티코어에서 값이 깨진다", hook: "원자성과 메모리 배리어"}
  - {id: E10, season: S2, title: "async는 빠르지 않다", hook: "이벤트 루프"}

  - {id: E11, season: S3, title: "시스템 콜은 왜 비싼가", hook: "커널 모드 전환"}
  - {id: E12, season: S3, title: "epoll이 푸는 진짜 문제", hook: "블로킹과 논블로킹"}
  - {id: E13, season: S3, title: "TIME_WAIT는 왜 쌓이나", hook: "TCP 연결 상태"}
  - {id: E14, season: S3, title: "대역폭은 남는데 느린 이유", hook: "TCP 혼잡 제어"}
  - {id: E15, season: S3, title: "첫 요청만 느린 이유", hook: "DNS와 연결 수립"}

  - {id: E16, season: S4, title: "빅오가 거짓말할 때", hook: "상수가 지배하는 구간"}
  - {id: E17, season: S4, title: "해시 테이블의 최악", hook: "충돌과 리해싱"}
  - {id: E18, season: S4, title: "DB 인덱스가 B-트리인 이유", hook: "디스크와 트리"}
  - {id: E19, season: S4, title: "실무 정렬은 퀵소트가 아니다", hook: "팀소트"}
  - {id: E20, season: S4, title: "이론상 빠른데 실제로 느린 것", hook: "캐시와 자료구조"}
