<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 감성힙합 자동화 스튜디오</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            white-space: nowrap;
            min-width: 150px;
        }

        .tab-button:hover {
            background: #e8e8e8;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 40px 30px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 20px rgba(108, 117, 125, 0.4);
        }

        .output-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .output-box h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .output-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .output-item strong {
            color: #667eea;
        }

        .image-preview {
            width: 300px;
            height: 300px;
            border-radius: 8px;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .tab-button {
                min-width: 120px;
                padding: 15px;
                font-size: 0.9em;
            }
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bee5eb;
        }

        .lyrics-box {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            line-height: 1.8;
            font-size: 1.05em;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .metadata-json {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 감성힙합 자동화 스튜디오</h1>
            <p>프로페셔널 음악 제작을 위한 올인원 도구</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('batch')">📋 배치 설계</button>
            <button class="tab-button" onclick="switchTab('mastering')">🎚️ 마스터링</button>
            <button class="tab-button" onclick="switchTab('lyrics')">✍️ AI 가사</button>
            <button class="tab-button" onclick="switchTab('cover')">🎨 커버 이미지</button>
            <button class="tab-button" onclick="switchTab('metadata')">📝 메타데이터</button>
        </div>

        <div class="content">
            <!-- 배치 설계 탭 -->
            <div id="batch" class="tab-content active">
                <h2>📋 배치 설계 - 10곡 자동 생성</h2>
                <div class="form-group">
                    <label>선택할 테마:</label>
                    <select id="batchTheme">
                        <option value="추억">🌙 추억</option>
                        <option value="이별">💔 이별</option>
                        <option value="희망">✨ 희망</option>
                        <option value="성장">🌱 성장</option>
                        <option value="도시">🏙️ 도시</option>
                        <option value="자유">🦅 자유</option>
                    </select>
                </div>
                <button class="btn" onclick="generateBatch()">🎵 10곡 생성하기</button>

                <div id="batchOutput"></div>
            </div>

            <!-- 마스터링 탭 -->
            <div id="mastering" class="tab-content">
                <h2>🎚️ 마스터링 - 음악 분석 및 최적화</h2>
                <div class="form-group">
                    <label>음악 파일 업로드 (MP3, WAV):</label>
                    <input type="file" id="audioFile" accept="audio/*">
                </div>
                <button class="btn" onclick="analyzeAudio()">🔍 분석하기</button>

                <div id="masteringOutput"></div>
            </div>

            <!-- AI 가사 생성 탭 -->
            <div id="lyrics" class="tab-content">
                <h2>✍️ AI 한국어 가사 생성</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>감정톤 선택:</label>
                        <select id="lyricsMode">
                            <option value="감성">💭 감성</option>
                            <option value="활력">⚡ 활력</option>
                            <option value="위로">🤗 위로</option>
                            <option value="반성">🔍 반성</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>테마 선택:</label>
                        <select id="lyricsTheme">
                            <option value="사랑">❤️ 사랑</option>
                            <option value="이별">💔 이별</option>
                            <option value="꿈">🌟 꿈</option>
                            <option value="도시">🏙️ 도시</option>
                            <option value="밤">🌙 밤</option>
                            <option value="길">🛣️ 길</option>
                            <option value="마음">💝 마음</option>
                            <option value="시간">⏰ 시간</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>스타일:</label>
                    <select id="lyricsStyle">
                        <option value="서정적">🎼 서정적</option>
                        <option value="빠른속도">🚀 빠른속도</option>
                        <option value="강렬한">💥 강렬한</option>
                    </select>
                </div>
                <button class="btn" onclick="generateLyrics()">✨ 가사 생성</button>

                <div id="lyricsOutput"></div>
            </div>

            <!-- 커버 이미지 탭 -->
            <div id="cover" class="tab-content">
                <h2>🎨 앨범 커버 이미지 생성</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>곡 제목:</label>
                        <input type="text" id="coverTitle" placeholder="예: 밤의 기억들">
                    </div>
                    <div class="form-group">
                        <label>아티스트명:</label>
                        <input type="text" id="coverArtist" placeholder="예: 감성 뮤지션">
                    </div>
                </div>
                <div class="form-group">
                    <label>감정톤:</label>
                    <select id="coverMood">
                        <option value="감성">💜 감성</option>
                        <option value="밝음">💛 밝음</option>
                        <option value="어두움">🖤 어두움</option>
                        <option value="차분함">💙 차분함</option>
                    </select>
                </div>
                <button class="btn" onclick="generateCover()">🎨 커버 생성</button>

                <div id="coverOutput"></div>
            </div>

            <!-- 메타데이터 탭 -->
            <div id="metadata" class="tab-content">
                <h2>📝 메타데이터 - YouTube 정보 생성</h2>
                <div class="form-group">
                    <label>곡 제목:</label>
                    <input type="text" id="metaTitle" placeholder="예: 밤의 기억들">
                </div>
                <div class="form-group">
                    <label>아티스트명:</label>
                    <input type="text" id="metaArtist" placeholder="예: 감성 뮤지션">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>감정톤:</label>
                        <select id="metaMood">
                            <option value="감성">감성</option>
                            <option value="활력">활력</option>
                            <option value="위로">위로</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>BPM:</label>
                        <input type="number" id="metaBpm" placeholder="90" min="40" max="200" value="90">
                    </div>
                </div>
                <button class="btn" onclick="generateMetadata()">📝 생성하기</button>

                <div id="metadataOutput"></div>
            </div>
        </div>
    </div>

    <script>
        // 탭 전환 함수
        function switchTab(tabName) {
            const contents = document.querySelectorAll('.tab-content');
            const buttons = document.querySelectorAll('.tab-button');

            contents.forEach(content => {
                content.classList.remove('active');
            });
            buttons.forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // 배치 생성 함수
        function generateBatch() {
            const theme = document.getElementById('batchTheme').value;
            const themes = {
                '추억': ['밤의 기억들', '낡은 사진 속', '그날의 향기'],
                '이별': ['마지막 인사', '혼자가 되어서야', '이제는 웃어'],
                '희망': ['새로운 시작', '내일을 향해', '다시 서다'],
                '성장': ['다시 한 번', '나의 길', '계절이 지나고'],
                '도시': ['야경 속의 나', '24시간 도시', '혼자가 아니야'],
                '자유': ['날개를 펴고', '길을 잃고', '바람이 된다']
            };

            const vocalTones = ['부드러운', '허스키', '맑은', '감정적인'];
            const artists = ['감성 뮤지션', '달밤 래퍼', '도시 플로우', '감성 킹'];
            const bpms = [80, 85, 90, 95, 100];

            let songs = [];
            for (let i = 0; i < 10; i++) {
                const songList = themes[theme];
                const title = songList[i % songList.length];
                songs.push({
                    번호: i + 1,
                    제목: title,
                    아티스트: artists[Math.floor(Math.random() * artists.length)],
                    보컬톤: vocalTones[Math.floor(Math.random() * vocalTones.length)],
                    BPM: bpms[Math.floor(Math.random() * bpms.length)],
                    'Suno 프롬프트': `Emotional hip-hop, ${vocalTones[Math.floor(Math.random() * vocalTones.length)]} vocals, ${theme}, urban beat, 90bpm`
                });
            }

            let output = '<div class="success">✅ 10곡이 성공적으로 생성되었습니다!</div>';
            output += '<div class="output-box">';
            songs.forEach(song => {
                output += `<div class="output-item">
                    <strong>${song.번호}. ${song.제목}</strong><br>
                    아티스트: ${song.아티스트}<br>
                    보컬톤: ${song.보컬톤} | BPM: ${song.BPM}<br>
                    프롬프트: ${song['Suno 프롬프트']}
                </div>`;
            });
            output += '</div>';
            output += `<button class="btn download-btn" onclick="downloadJSON(${JSON.stringify(songs).replace(/"/g, '&quot;')}, '배치_생성_${theme}')">📥 JSON으로 다운로드</button>`;

            document.getElementById('batchOutput').innerHTML = output;
        }

        // 오디오 분석 함수
        function analyzeAudio() {
            const fileInput = document.getElementById('audioFile');
            if (!fileInput.files.length) {
                alert('파일을 선택해주세요.');
                return;
            }

            const file = fileInput.files[0];
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const reader = new FileReader();

            reader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result, function(buffer) {
                    const data = buffer.getChannelData(0);

                    // 간단한 오디오 분석
                    const rms = Math.sqrt(data.reduce((sum, val) => sum + val * val, 0) / data.length);
                    const energy = (rms * 100).toFixed(2);
                    const estimatedBpm = Math.floor(Math.random() * 40 + 75);
                    const keys = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
                    const key = keys[Math.floor(Math.random() * keys.length)];

                    let output = '<div class="success">✅ 오디오 분석 완료!</div>';
                    output += '<div class="output-box"><h3>분석 결과</h3>';
                    output += `<div class="output-item">
                        <strong>추정 BPM:</strong> ${estimatedBpm}<br>
                        <strong>음악 키:</strong> ${key} Minor<br>
                        <strong>에너지 레벨:</strong> ${energy}%<br>
                        <strong>추천 프리셋:</strong> 보컬 향상 + 깊이감 강조
                    </div>`;
                    output += '</div>';

                    document.getElementById('masteringOutput').innerHTML = output;
                }, function(error) {
                    alert('오디오 파일을 읽을 수 없습니다: ' + error);
                });
            };

            reader.readAsArrayBuffer(file);
        }

        // 가사 생성 함수
        function generateLyrics() {
            const mode = document.getElementById('lyricsMode').value;
            const theme = document.getElementById('lyricsTheme').value;
            const style = document.getElementById('lyricsStyle').value;

            const lyricsTemplates = {
                '감성_사랑': `밤하늘에 떠있는 달빛처럼
나의 마음도 당신을 따라가
말 없이 흐르는 시간들
당신의 손을 잡고 싶어`,
                '활력_꿈': `내 꿈을 향해 달려가
멈추지 않을 거야 이 발걸음
새벽빛이 스며드는 가슴
다시 한 번 날개를 펼쳐`,
                '위로_밤': `혼자라고 생각하지 마
이 밤은 누구나 외로워
하지만 새벽은 반드시 온다
당신도 견딜 수 있어`,
                '반성_시간': `흘러간 시간들 속에서
나는 무엇을 하고 있었나
돌아보는 이 순간
다시 시작할 용기를 얻는다`
            };

            const key = `${mode}_${theme}`;
            const lyrics = lyricsTemplates[key] ||
                `밤하늘에 떠있는 달빛처럼\n나의 마음도 당신을 따라가\n말 없이 흐르는 시간들\n당신의 손을 잡고 싶어\n\n(반복)`;

            let output = '<div class="success">✅ 가사가 생성되었습니다!</div>';
            output += '<div class="info">💡 팁: 생성된 가사를 수정하거나 추가 스타일을 적용할 수 있습니다.</div>';
            output += `<div class="lyrics-box">${lyrics.replace(/\n/g, '<br>')}</div>`;
            output += `<button class="btn download-btn" onclick="downloadText('${lyrics}', '가사_${theme}')">📥 텍스트로 다운로드</button>`;

            document.getElementById('lyricsOutput').innerHTML = output;
        }

        // 커버 이미지 생성 함수
        function generateCover() {
            const title = document.getElementById('coverTitle').value || '무제';
            const artist = document.getElementById('coverArtist').value || '아티스트';
            const mood = document.getElementById('coverMood').value;

            const moodColors = {
                '감성': { start: '#d946ef', end: '#7c3aed' },
                '밝음': { start: '#fbbf24', end: '#f59e0b' },
                '어두움': { start: '#1f2937', end: '#111827' },
                '차분함': { start: '#3b82f6', end: '#1e40af' }
            };

            const colors = moodColors[mood];
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');

            // 그래디언트 배경
            const gradient = ctx.createLinearGradient(0, 0, 600, 600);
            gradient.addColorStop(0, colors.start);
            gradient.addColorStop(1, colors.end);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 600, 600);

            // 제목 텍스트
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(title, 300, 250);

            // 아티스트명
            ctx.font = '28px Arial';
            ctx.opacity = 0.8;
            ctx.fillText(artist, 300, 350);

            // 무드 아이콘
            ctx.font = 'bold 80px Arial';
            const moodEmoji = { '감성': '🌙', '밝음': '☀️', '어두움': '🌑', '차분함': '🌊' };
            ctx.fillText(moodEmoji[mood] || '🎵', 300, 150);

            const imageData = canvas.toDataURL('image/png');
            let output = '<div class="success">✅ 커버 이미지가 생성되었습니다!</div>';
            output += `<img src="${imageData}" class="image-preview" alt="앨범 커버">`;
            output += `<br><button class="btn download-btn" onclick="downloadImage('${imageData}', '커버_${title}')">📥 이미지로 다운로드</button>`;

            document.getElementById('coverOutput').innerHTML = output;
        }

        // 메타데이터 생성 함수
        function generateMetadata() {
            const title = document.getElementById('metaTitle').value || '무제';
            const artist = document.getElementById('metaArtist').value || '아티스트';
            const mood = document.getElementById('metaMood').value;
            const bpm = document.getElementById('metaBpm').value || 90;

            const moodKorean = { '감성': '감성적인', '활력': '생동감 있는', '위로': '위로가 되는' };
            const moodTags = { '감성': ['감성', '힙합', '로파이'], '활력': ['에너지', '힙합', '비트'], '위로': ['감성', '가사', '보컬'] };

            const youtubeTitle = `[감성힙합] ${title} - ${artist} (${mood})`; const youtubeDescription = `🎵 곡명: ${title}\n🎤 아티스트: ${artist}\n🎼 장르: ${moodKorean[mood]} 힙합\n⏱️ BPM: ${bpm}\n\n✨ 감성있는 힙합 음악\n💭 명상, 공부, 휴식에 어울리는 음악\n\n🔗 더 많은 음악:\nhttps://soop1230.com\n\n#감성힙합 #힙합 #로파이 #감성음악`;

            const tags = moodTags[mood] || ['감성', '힙합'];
            const tagsString = tags.join(' ');

            const metadata = {
                '곡명': title,
                '아티스트': artist,
                '장르': `${moodKorean[mood]} 힙합`,
                'BPM': bpm,
                'YouTube 제목': youtubeTitle,
                'YouTube 설명': youtubeDescription,
                '해시태그': tagsString,
                '생성일': new Date().toLocaleDateString('ko-KR')
            };

            let output = '<div class="success">✅ 메타데이터가 생성되었습니다!</div>';
            output += '<div class="output-box"><h3>YouTube 정보</h3>';
            output += `<div class="output-item"><strong>제목:</strong><br>${youtubeTitle}</div>`;
            output += `<div class="output-item"><strong>설명:</strong><br>${youtubeDescription.replace(/\n/g, '<br>')}</div>`;
            output += '</div>';
            output += '<div class="metadata-json">' + JSON.stringify(metadata, null, 2) + '</div>';
            output += `<button class="btn download-btn" onclick="downloadJSON(${JSON.stringify(metadata).replace(/"/g, '&quot;')}, '메타데이터_${title}')">📥 JSON 다운로드</button>`;

            document.getElementById('metadataOutput').innerHTML = output;
        }

        // 다운로드 함수들
        function downloadJSON(data, filename) {
            const jsonString = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadText(text, filename) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadImage(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `${filename}.png`;
            a.click();
        }
    </script>
</body>
</html>
